# Thème d'exemple du corpus documentaire (08-video/documentaire.md).
# Un thème découpe le film en emplacements décrits en langage visuel, et donne
# pour chacun des requêtes de recherche (en anglais : les archives sont
# indexées en anglais). La description sert à la recherche CLIP
# (corpus.py search <nom> --emplacement <id>).
#
# python3 08-video/scripts/corpus.py build 08-video/corpus/themes/exemple-savoir-faire.toml

nom = "savoir-faire"
sources = ["archive", "wikimedia", "nasa", "pexels", "pixabay"]
par_requete = 3
duree_max = 120
# licences = ["domaine-public", "cc0", "cc-by", "pexels", "pixabay"]   # défaut

[[emplacements]]
id = "ouverture"
description = "gros plan de mains d'artisan qui travaillent une matière, lumière d'atelier"
requetes = ["craftsman hands close up", "workshop hands working"]

[[emplacements]]
id = "heritage"
description = "atelier ou usine filmé en noir et blanc, ouvriers au travail, archives anciennes"
requetes = ["vintage factory workers", "1950s workshop film"]

[[emplacements]]
id = "geste"
description = "outil qui façonne une pièce, copeaux ou étincelles, plan serré"
requetes = ["wood shavings plane tool", "metal grinding sparks"]

[[emplacements]]
id = "aujourd-hui"
description = "atelier contemporain lumineux, machine moderne de précision"
requetes = ["modern workshop precision machine", "cnc machine close up"]
