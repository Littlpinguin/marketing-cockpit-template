# Fails when a tracked file holds a string shaped like a real token (JWT, sk-…, Google API key, api_key = …).
# Same pattern as the "Hygiène git" check of .claude/commands/health-check.md: change both together.
# Example files (*.example, .env.example) hold placeholders and are skipped; binary files are skipped (-I).
# Read-only: no secret, no write permission, no third-party action.
name: secrets

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Look for tokens in tracked files
        run: |
          rc=0
          git grep -nIE "(eyJ[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9]{20,}|AIza[A-Za-z0-9_-]{30,}|api[_-]?key[\"'[:space:]]*[:=][\"'[:space:]]*[A-Za-z0-9_-]{20,})" \
            -- . ':(exclude)*.example' ':(exclude).env.example' || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::Token-shaped string in a tracked file (lines above). Revoke the key first, then remove it: see SECURITY.md."
            exit 1
          fi
          if [ "$rc" -ne 1 ]; then
            echo "::error::git grep failed (exit $rc)."
            exit "$rc"
          fi
          echo "No token-shaped string in tracked files."
