      items:
        - q: "Faut-il avoir déjà répondu à un marché public ?"
          a: >-
            Non. Le premier atelier part de la lecture d’un dossier, et l’appel
            de cadrage sert à choisir un appel d’offres à votre mesure.
        - q: "Combien de temps prévoir entre deux ateliers ?"
          a: >-
            Environ deux heures par semaine. Les exercices portent sur votre
            propre offre : ce temps avance votre dossier.
        - q: "Que se passe‑t‑il si je manque un atelier ?"
          a: >-
            Chaque atelier est enregistré et la vidéo arrive le jour même. Vos
            questions passent par le groupe d’échange.
        - q: "La formation peut-elle être prise en charge ?"
          a: >-
            Souvent, par votre opérateur de compétences. La convention et le
            programme partent dès l’inscription ; comptez trois à quatre
            semaines pour l’accord.
        - q: "Et si aucun appel d’offres ne tombe pendant la cohorte ?"
          a: >-
            Nous travaillons sur un dossier récent de votre secteur, déjà clos.
            La méthode est la même, et votre trame sera prête pour le suivant.
        - q: "Peut-on venir à deux ?"
          a: >-
            Oui, avec la formule Binôme : deux personnes de la même entreprise
            et un seul mémoire relu.
