    slots:
      title: 'Où se perdent<br><span class="hl">vos offres publiques</span>'
      intro: >-
        Ce que racontent les dirigeants à l’appel de cadrage, avant même le
        premier atelier.
      items:
        - title: "Dix jours pour un dossier de cent pages"
          text: >-
            Le dossier de consultation arrive un lundi, la date limite tombe
            la semaine suivante, entre deux chantiers.
          visual: |-
            <div class="obj obj-window s-problem__obj"><div class="obj-window__bar"><i></i><i></i><i></i><span>Avis de marché 27-0412</span></div><div class="obj-window__body"><div class="obj-grid" style="--cols:2"><span class="is-head">Étape</span><span class="is-head">Date</span><span>Publication</span><span>2 mars</span><span>Questions à l’acheteur</span><span>avant le 8 mars</span><span class="is-warn">Remise des offres</span><span class="is-warn">12 mars, 12 h</span></div><p class="obj-small" style="margin-top:12px">Dossier de consultation · 142 pages · 7 pièces</p></div></div>
        - title: "Le mémoire de la dernière fois"
          text: >-
            On reprend l’offre du marché précédent et on change le nom de
            l’acheteur. Les critères, eux, ont changé.
          visual: |-
            <div class="obj obj-window s-problem__obj"><div class="obj-window__bar"><i></i><i></i><i></i><span>memoire_v6_COPIE.docx</span></div><div class="obj-window__body"><p class="obj-title">3. Méthodologie</p><div class="obj-lines" style="margin-top:10px"><i style="--w:96%"></i><i style="--w:88%"></i><i style="--w:62%"></i></div><div class="obj-rule"></div><p class="obj-small"><span class="obj-strike">Critère : délai d’intervention sous 48 h</span></p><p class="obj-small" style="margin-top:6px">Critère demandé cette fois : <span class="obj-highlight">gestion des déchets verts</span></p></div></div>
        - title: "Une note technique qui coule l’offre"
          text: >-
            Le prix était bien placé. Le rapport d’analyse donne 31 points sur
            60 en valeur technique, et le marché part ailleurs.
          visual: |-
            <div class="obj obj-sheet s-problem__obj"><div class="obj-head"><span class="obj-mark"></span><b>Analyse des offres</b></div><div class="obj-rule"></div><div class="obj-bars"><div class="obj-bar" style="--v:.95"><span>Prix</span><span class="obj-bar__track"><i class="obj-bar__fill"></i></span><b>38/40</b></div><div class="obj-bar is-hl" style="--v:.52"><span>Technique</span><span class="obj-bar__track"><i class="obj-bar__fill"></i></span><b>31/60</b></div></div><div class="obj-rule"></div><p class="obj-small">Motif : <span class="obj-highlight">méthodologie générale, aucun planning daté</span></p><div class="obj-rule"></div><div class="obj-head"><span>Classement de votre offre</span><span class="obj-push"><b>3 / 5</b></span></div></div>
        - title: "Un dépôt à midi moins deux"
          text: >-
            La signature électronique bloque, une attestation manque, et
            l’offre arrive incomplète.
          visual: |-
            <div class="obj obj-sheet s-problem__obj"><div class="obj-head"><span class="obj-mark"></span><b>Pièces à déposer</b><span class="obj-stamp obj-push">11 h 58</span></div><div class="obj-rule"></div><div class="obj-check"><span class="is-done">Mémoire technique</span><span class="is-done">Bordereau des prix</span><span>Attestation d’assurance</span><span>Signature électronique</span></div></div>

  - use: letter
    id: lettre
    slots:
      title: 'Ce que je lisais<br><span class="hl">de l’autre côté du guichet</span>'
      salutation: "Madame, Monsieur,"
      paragraphs:
        - text: >-
            Pendant neuf ans, j’ai ouvert les offres des entreprises qui
            répondaient aux marchés de ma collectivité. Beaucoup venaient de très
            bonnes entreprises, et beaucoup perdaient avant même qu’on parle de prix.
          ink: false
          pull: ""
        - text: >-
            La raison tenait souvent en une ligne du rapport d’analyse :
            méthodologie générale, aucun planning daté. Le mémoire racontait
            l’entreprise au lieu de répondre aux critères que nous avions écrits.
          ink: false
          pull: ""
        - text: >-
            Un mémoire qui gagne suit la grille de l’acheteur, critère après
            critère, avec une preuve pour chacun. Cela s’apprend en quelques
            matinées, sur votre propre dossier.
          ink: true
          pull: "Un mémoire qui gagne suit la grille de l’acheteur, critère après critère"
        - text: >-
            C’est ce que nous faisons pendant les cinq ateliers. Je relis chaque
            mémoire comme je le faisais au service des achats, avec la même
            grille, avant que vous ne le déposiez.
          ink: false
          pull: ""
