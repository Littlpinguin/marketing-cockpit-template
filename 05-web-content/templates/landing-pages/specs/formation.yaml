# ============================================================================
# Modèle de landing : FORMATION (formation payante, atelier, cohorte datée)
# ----------------------------------------------------------------------------
# Assemblage :
#   python3 05-web-content/scripts/assemble-landing.py \
#     05-web-content/templates/landing-pages/specs/formation.yaml
#   python3 05-web-content/scripts/qa-landing.py \
#     05-web-content/templates/landing-pages/formation.html
#
# Pour une vraie page : copier ce fichier vers
# 05-web-content/landing-pages/<slug>/pilotage/page.yaml, changer « output »
# et « page », réécrire chaque texte (skills copywriting puis copy-editing),
# remplacer chaque objet composé par un vrai document de la formation, puis
# dérouler la skill landing-page (brief, charte, QA, quatre revues,
# brand-check). Les polices de « fonts » suivent 01-brand/tokens.json.
#
# Marque d'exemple : Ferlane Formation, organisme FICTIF qui forme les TPE et
# PME à répondre aux marchés publics. Prix, dates, noms, fonctions et avis
# sont inventés pour montrer le ton et les longueurs : rien ne part en ligne
# tel quel. Les personnes et les avis sont marqués comme fictifs sur la page.
#
# À brancher avant publication (marqueurs du dépôt, signalés par la QA) :
#   {{URL_CHECKOUT}}          outil de vente ou d'inscription : le billet y
#                             part en GET avec ?formule=solo|binome et les UTM
#   {{URL_LISTE_ATTENTE}}     liste d'attente (état « waitlist » de l'offre),
#                             et lien « Être prévenu » de l'état « closed »
#   {{URL_MENTIONS_LEGALES}}  page des mentions légales
#   {{URL_CONFIDENTIALITE}}   page de politique de confidentialité
# Le contact bonjour@example.com (FAQ, mentions, pied) se remplace par la
# vraie adresse.
#
# État de l'offre : une seule configuration, « offer » ci-dessous. Ouverte
# jusqu'à closes_at, puis liste d'attente ; « state: waitlist » ou
# « state: closed » à la main quand la cohorte est pleine. Les jours restants
# se calculent dans le navigateur (jamais de secondes).
#
# Mesure : mode datalayer. Événements cta_click (positions topbar, hero, faq,
# final, barre-mobile), begin_checkout à l'envoi du billet (formule, valeur,
# devise), faq_open ; UTM de la visite ajoutés au billet. Pour GA4 :
# tracking.mode gtag et tracking.ga4 ; pour GTM : mode gtm et gtm. Marquer
# begin_checkout comme conversion clé côté GA4 (action manuelle).
#
# Récit : une objection par section, dans l'ordre de la pensée du dirigeant.
#   hero        De quoi s'agit-il, pour qui, jusqu'à quand : le mémoire relu
#   essentiel   Quand, comment, combien : six faits pratiques collés au hero
#               (facts-grid, titre lu par les lecteurs d'écran seulement ;
#               l'effectif suit l'état de l'offre)
#   probleme    Pourquoi maintenant : quatre scènes vécues (seul épinglage)
#   lettre      Qui est derrière, pourquoi lui faire confiance : la lettre
#               signée de l'ancienne acheteuse, qui répond au problème
#               (letter, sans signature tracée : personnage fictif)
#   programme   Qu'y a-t-il dedans : cinq mardis datés, un spécimen relu (rail)
#   parole      Qu'en dit quelqu'un qui l'a vécu : une phrase en respiration,
#               une annotation à main levée (quote-interlude)
#   kit         Qu'est-ce que j'emporte : quatre outils (bande sombre)
#   formateurs  Avec qui : l'acheteuse et le chargé d'affaires
#   avis        D'autres l'ont-ils fait : trois résultats signés (fictifs)
#   pour-qui    Est-ce pour moi : et pour qui ce n'est pas
#   offre       Combien, compris, la suite, prérequis : le billet
#   questions   Dernières questions, carte collante qui ramène au billet
#   mentions    Qui vend, à quelles conditions
#   final       Je passe à l'action (bande sombre)
# Un épinglage et un rail ; deux bandes sombres, jamais d'affilée ; une seule
# conversion (#offre) pour tous les boutons, lien de la lettre compris ; le
# seul accent fort est le bouton du billet.
# ============================================================================
