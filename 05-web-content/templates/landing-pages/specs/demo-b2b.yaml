  - use: faq
    id: questions
    slots:
      title: >-
        Les questions<br><span class="hl">avant une démo</span>
      intro: ""
      items:
        - q: "Faut-il remplacer notre WMS ?"
          a: >-
            Calquai planifie les rendez-vous et les quais, et votre WMS garde
            les stocks et les réceptions. Les deux échangent les commandes et les clôtures.
        - q: "Nos transporteurs doivent-ils installer quelque chose ?"
          a: >-
            Ils reçoivent un lien de réservation avec la commande et choisissent
            leur créneau dans le navigateur, sans compte ni application.
        - q: "Combien coûte Calquai ?"
          a: >-
            Un abonnement par quai et par mois, dégressif à partir de dix quais.
            Le chiffrage exact suit la démo, avec votre nombre de quais et de sites.
        - q: "Peut-on tester avant de s’engager ?"
          a: >-
            Oui. Le pilote dure deux semaines sur un quai, avec trois de vos
            transporteurs, et compare l’attente avant et après.
        - q: "Combien de temps pour équiper un site ?"
          a: >-
            Trois semaines en général entre la signature et le premier camion
            réservé, connexion au WMS comprise. Le planning se fixe pendant le pilote.
        - q: "Que deviennent nos données si nous ne donnons pas suite ?"
          a: >-
            L’export envoyé pour la démo est supprimé sous trente jours, et vous
            gardez le chiffrage.
