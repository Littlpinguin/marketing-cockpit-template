# ============================================================================
# Modèle de landing : ÉVÉNEMENT (conférence, rencontre, matinale ou webinar
# en direct, sur place et en ligne)
# ----------------------------------------------------------------------------
# Assemblage :
#   python3 05-web-content/scripts/assemble-landing.py \
#     05-web-content/templates/landing-pages/specs/evenement.yaml
#   python3 05-web-content/scripts/qa-landing.py \
#     05-web-content/templates/landing-pages/evenement.html
#
# Pour une vraie page : copier ce fichier vers
# 05-web-content/landing-pages/<slug>/pilotage/page.yaml, changer « output »
# et « page », réécrire chaque texte (skills copywriting puis copy-editing),
# puis dérouler la skill landing-page (brief, charte, QA, quatre revues,
# brand-check). Les polices de « fonts » suivent 01-brand/tokens.json.
#
# Marque d'exemple : Brivalle, éditeur FICTIF d'un logiciel de planification
# de tournées, qui organise sa matinale annuelle. Lieu (Halle Lucine), noms,
# fonctions, chiffres et avis sont inventés pour montrer le ton et les
# longueurs : rien ne part en ligne tel quel. Personnes et avis sont marqués
# comme fictifs sur la page.
#
# Variantes :
#   - 100 % en ligne (webinar) : retirer la section « acces », ne garder que
#     le mode « En ligne » de l'inscription (modes_legend vide : le mode part
#     en champ caché), et réécrire les faits « Où » et les étapes ;
#   - 100 % sur place : retirer le mode « En ligne » et le repère « Direct » ;
#   - événement payant : remplacer event-registration par offer-ticket
#     (formules Sur place / En ligne, {{URL_CHECKOUT}}), comme dans
#     specs/formation.yaml.
#
# À brancher avant publication (marqueurs du dépôt, signalés par la QA) :
#   {{FORM_ENDPOINT}}         endpoint POST de l'inscription (n8n, outil
#                             d'événement) ; reçoit participation, name,
#                             email, company, question, prochaines et les UTM
#   {{URL_ITINERAIRE}}        lien d'itinéraire vers le lieu
#   {{URL_CONFIDENTIALITE}}   page de politique de confidentialité
#   {{URL_MENTIONS_LEGALES}}  page des mentions légales
# Le contact matinale@example.com (FAQ, inscription, pied) se remplace par la
# vraie adresse.
#
# État des inscriptions : une seule configuration, « offer » ci-dessous.
# Ouvertes jusqu'à closes_at, puis closes (bouton désactivé, message de
# clôture) ; « state: waitlist » à la main quand la salle est pleine : l'option
# « Sur place » se désactive, le direct reste ouvert. Jours restants calculés
# dans le navigateur, jamais de secondes.
#
# Mesure : mode datalayer. Événements cta_click (positions topbar, hero, faq,
# final, barre-mobile), generate_lead à l'inscription (avec participation :
# sur-place ou en-ligne), faq_open ; UTM de la visite ajoutés au formulaire
# en champs cachés. Pour GA4 : tracking.mode gtag et tracking.ga4 ; pour GTM :
# mode gtm et gtm. Marquer generate_lead comme conversion clé côté GA4.
#
# Récit : une objection par section, dans l'ordre de la pensée du visiteur.
#   hero          Quoi, quand, où, combien : le titre fait l'affiche, puis
#                 la ligne de faits (hero-editorial, sans objet ; pas de
#                 fiche pratique en plus, elle doublerait cette ligne)
#   rapporter     Est-ce que ça vaut ma matinée : ce qu'on rapporte au dépôt
#   programme     Qu'y a-t-il exactement : l'horaire, un spécimen (rail)
#   intervenants  Qui parle, et sont-ils crédibles
#   acces         Comment j'y vais, ou je suis à distance : lieu, direct,
#                 replay (seul épinglage)
#   avis          D'autres y sont-ils allés : l'édition précédente (fictifs)
#   pour-qui      Est-ce pour moi : et pour qui c'est moins utile
#   inscription   Je m'inscris, sur place ou en ligne (bande sombre,
#                 event-registration)
#   questions     Dernières questions, carte collante qui ramène au formulaire
#   pratique      Organisateur, lieu, image, données, report
#   final         Je passe à l'action (bande sombre)
# Un épinglage et un rail ; deux bandes sombres, jamais d'affilée ; une seule
# conversion (#inscription) pour tous les boutons ; le seul accent fort est
# le bouton d'envoi.
# ============================================================================
