  - use: faq
    id: questions
    slots:
      title: >-
        Vos questions<br><span class="hl">avant le devis</span>
      intro: ""
      items:
        - q: "Mon site est-il concerné par l’obligation d’accessibilité ?"
          a: >-
            Depuis le 28 juin 2025, l’acte européen sur l’accessibilité couvre
            notamment le commerce en ligne, les services bancaires et le
            transport de voyageurs, avec une exemption pour les microentreprises
            de services. Nous vérifions votre cas au premier appel.
        - q: "Un outil automatique ne suffit-il pas ?"
          a: >-
            Les outils repèrent une partie des défauts techniques. Le parcours
            au lecteur d’écran et la pertinence des alternatives demandent un
            test humain : c’est l’essentiel de nos journées d’audit.
        - q: "Corrigez-vous le code vous-mêmes ?"
          a: >-
            Vos développeurs ou votre agence corrigent, avec nos tickets et la
            permanence hebdomadaire. Si vous n’avez personne, nous vous orientons
            vers des développeurs formés.
        - q: "Le prix peut-il changer en cours de mission ?"
          a: >-
            Le devis fixe le périmètre et le prix. Si vous ajoutez des pages en
            route, nous chiffrons l’ajout et attendons votre accord avant de commencer.
        - q: "Combien de temps dure une mission ?"
          a: >-
            Trois semaines pour un audit ciblé, trois à quatre mois avec
            l’accompagnement des corrections. Le devis donne le calendrier exact.
        - q: "Auditez-vous les applications mobiles ?"
          a: >-
            Oui, avec le référentiel adapté aux applications mobiles. Le devis
            se fait sur les écrans des parcours clés.
      jsonld: false
      card_label: "Devis gratuit"
      card_title: "Audit d’accessibilité"
      card_meta: "Dès 4 800 € HT, rapport et tickets compris"
      cta_label: "Demander un devis"
      cta_href: "#devis"
      contact: >-
        Une autre question ? <a href="mailto:bonjour@example.com">bonjour@example.com</a>

