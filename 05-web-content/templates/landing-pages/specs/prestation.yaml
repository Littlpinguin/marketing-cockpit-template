# ============================================================================
# Modèle de landing : PRESTATION DE SERVICE (audit, conseil, mission d'agence)
# Conversion : une demande de devis qualifiée, suivie d'un appel découverte.
# ----------------------------------------------------------------------------
# Assemblage :
#   python3 05-web-content/scripts/assemble-landing.py \
#     05-web-content/templates/landing-pages/specs/prestation.yaml
#   python3 05-web-content/scripts/qa-landing.py \
#     05-web-content/templates/landing-pages/prestation.html
#
# Pour une vraie page : copier ce fichier vers
# 05-web-content/landing-pages/<slug>/pilotage/page.yaml, changer « output »
# et « page », réécrire chaque texte (skills copywriting puis copy-editing),
# puis dérouler la skill landing-page.
#
# Marque d'exemple : Ouvrance, cabinet FICTIF d'audit d'accessibilité
# numérique. Personnes, cas, avis et prix sont inventés pour montrer le ton,
# les longueurs et une logique de prix honnête : rien ne part en ligne tel
# quel. Les seuls faits réels de la page sont réglementaires (acte européen
# sur l'accessibilité, directive (UE) 2019/882, applicable depuis le 28 juin
# 2025 ; article 47 de la loi n° 2005-102 du 11 février 2005 pour la
# déclaration d'accessibilité ; référentiel RGAA et ses numéros de critères) :
# à revérifier au moment d'adapter.
#
# À brancher avant publication (marqueurs du dépôt, signalés par la QA) :
#   {{FORM_ENDPOINT}}         endpoint POST du formulaire de devis
#   {{URL_CONFIDENTIALITE}}   page de politique de confidentialité
#   {{URL_MENTIONS_LEGALES}}  page des mentions légales
# Le contact bonjour@example.com du pied et de la FAQ se remplace par la
# vraie adresse. Mesure : mode datalayer (cta_click, generate_lead, faq_open)
# et passage des UTM vers le formulaire (champs cachés).
#
# Récit : une objection par section, dans l'ordre de la pensée d'un client
# qui achète une prestation.
#   hero          De quoi s'agit-il : le titre porte une pastille, la voix d'un
#                 lecteur d'écran (hero-image-title, pastille sombre)
#   probleme      Pourquoi maintenant : quatre pièces posées sur la table au
#                 premier appel, un verdict, la réponse (problem-evidence, titre
#                 collant, non épinglé ; une note en marge porte la référence
#                 légale de la déclaration d'accessibilité)
#   methode       Concrètement, comment vous travaillez : cinq étapes datées, un spécimen
#   realisations  Qu'est-ce que ça produit, pour quelqu'un comme moi : huit
#                 audits en index filtrable par secteur, dossiers à feuilleter
#                 dans la visionneuse (work-wall, bande sombre)
#   equipe        Qui fait le travail : les deux personnes de la mission
#   pour-qui      Est-ce pour moi : qualifie avant le prix
#   perimetre     Lequel des trois périmètres : trois questions au plus, puis le
#                 périmètre conseillé avec son prix de départ (recommender)
#   tarifs        Combien : trois périmètres, prix de départ et ce qui les fait varier
#   devis         Je demande un devis : six champs, dont l'adresse et la taille du site
#   questions     Dernières questions, carte collante qui ramène au formulaire
#   final         Je passe à l'action (bande sombre)
# Les cas avant / après (cases) ne sont plus sur la page : les deux sites
# étaient déjà les deux premiers audits du mur, contre-audit compris. Pour
# une offre avec peu de réalisations, remettre cases (dark: true) à la place
# du mur.
# Les colonnes de for-whom s'appellent fit et not_fit : en YAML 1.1, les clés
# yes et no nues se lisent comme des booléens (l'assembleur refuse alors la
# spec ; les cellules yes / no du tableau comparatif s'écrivent entre
# guillemets).
# Formulaire sans case de consentement : la demande de devis fonde le
# traitement (mesures précontractuelles) ; la mention de confidentialité,
# avec son lien, reste sous le bouton.
# Aucune section épinglée ; une bande sombre (le mur) plus le CTA final ; une seule conversion (#devis) pour tous les boutons, grille
# tarifaire et recommandeur compris.
# ============================================================================
output: 05-web-content/templates/landing-pages/prestation.html
title: "Ouvrance · Audit d’accessibilité numérique"
description: >-
  Vos parcours testés avec des utilisateurs de lecteur d’écran, puis chaque
  correction livrée en ticket priorisé. Devis sous trois jours ouvrés.
lang: fr
page: prestation
robots: "noindex, nofollow"
fonts: ["Inter:wght@400;500;600;700;800", "JetBrains Mono:wght@500;600"]
ground: dots
theatre: {progress: true}
tracking: {mode: datalayer, utm: true}
skip_link: "Aller au contenu"

