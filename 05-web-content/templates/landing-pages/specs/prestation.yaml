      lede: >-
        Vos parcours clés testés avec des utilisateurs de lecteur d’écran, puis
        chaque correction remise en ticket priorisé.
      cta_label: "Demander un devis"
      cta_href: "#devis"
      primary: true
      secondary_label: ""
      secondary_href: ""
      deadline: "Devis sous trois jours ouvrés"
      countdown: null
      detail: "Premier appel de 30 minutes"
      proof: ""

  - use: problem-evidence
    id: probleme
    slots:
      title: 'Ce que l’on nous montre<br><span class="hl">au premier appel</span>'
      intro: "Quatre pièces que nos clients posent sur la table, avant même de parler de devis."
      exhibit_word: "Pièce n°"
      items:
        - object: >-
            <div class="obj obj-window"><div class="obj-window__bar"><i></i><i></i><i></i><span>Service client · à traiter</span></div>
            <div class="obj-window__body obj-mail">
            <div class="obj-mail__from"><span class="obj-avatar">MR</span><span><b>Martine R.</b><br>Commande impossible</span></div>
            <div class="obj-lines"><i style="--w:94%"></i><i style="--w:72%"></i></div>
            <p class="obj-small">Avec mon lecteur d’écran, le bouton de paiement <span class="obj-highlight">ne dit rien</span>. J’ai abandonné mon panier.</p>
            <div class="obj-rule"></div>
            <p class="obj-small">Transféré 3 fois · sans réponse</p></div></div>
          caption: "Un panier abandonné au paiement"
          text: "Le message passe trois fois de service en service, et personne ne reproduit le blocage sans lecteur d’écran."
        - figure:
            value: "412"
            unit: "alertes"
            label: "sorties par l’outil automatique, dont neuf composants répétés sur chaque page"
            source: "Rapport d’un site client, 2026 (exemple fictif)"
          caption: "Trop d’alertes pour décider"
          text: "La liste mélange vrais blocages et doublons, et ne dit pas ce qui empêche de commander."
        - quote:
            text: "Notre agence nous a dit que le site était conforme. Personne ne sait sur quelle base."
            cite: "Responsable e-commerce, enseigne de prêt-à-porter (verbatim fictif)"
          caption: "Une conformité jamais vérifiée"
          text: "La déclaration en ligne annonce un site conforme, sans audit pour l’étayer ni date de vérification."
        - object: >-
            <div class="obj obj-window"><div class="obj-window__bar"><i></i><i></i><i></i><span>Tickets accessibilité · 0 sur 63 traités</span></div>
            <div class="obj-window__body"><div class="obj-check">
            <span>Contraste du pied de page</span><span>Ordre de tabulation du panier</span><span>Alternative du logo</span><span>Captcha du formulaire de contact</span><span>Menu au clavier</span>
            </div><div class="obj-rule"></div><p class="obj-small">Priorité : <span class="obj-highlight">non renseignée</span></p></div></div>
          caption: "Soixante tickets sans ordre"
          text: "Les développeurs commencent par les corrections faciles, et les blocages du parcours d’achat attendent."
      verdict_label: "Constat"
      verdict: "Des blocages que personne ne voit en interne"
      remedy_label: "Ce que change l’audit"
      # Une note en marge (base.css, notes en marge) porte la référence
      # légale : à revérifier au moment d'adapter la page.
      remedy: >-
        <span class="hl">L’audit Ouvrance</span> rejoue vos parcours avec des
        utilisateurs de lecteur d’écran, remet chaque correction en ticket
        priorisé et fonde une déclaration d’accessibilité vérifiable.<span class="note"><span class="note__body" role="note">La déclaration d’accessibilité est exigée des organismes visés par l’article 47 de la loi n° 2005-102 du 11 février 2005. L’acte européen sur l’accessibilité, directive (UE) 2019/882, s’applique depuis le 28 juin 2025.</span></span>
      cta_label: "Demander un devis"
      cta_href: "#devis"
      primary: true

  - use: program
    id: methode
    slots:
      title: >-
        Cinq étapes<br><span class="hl">du cadrage au contre‑audit</span>
      intro: >-
        Une mission type pour un site de 10 à 25 pages types. Le devis donne
        votre calendrier exact.
      modules:
        - when: "Semaine 1"
          title: "Cadrer l’échantillon"
          duration: "2 h d’atelier"
          text: >-
            Vos parcours clés et une quinzaine de pages types, choisis avec
            vous selon le trafic et les obligations.
        - when: "Semaines 2 et 3"
          title: "Tester à la main et avec des utilisateurs"
          duration: "8 à 12 jours"
          text: >-
            Chaque critère RGAA vérifié page par page, puis les parcours
            rejoués au clavier et au lecteur d’écran.
        - when: "Semaine 4"
          title: "Restituer en tickets"
          duration: "Une demi-journée"
          text: >-
            Chaque défaut devient un ticket dans votre outil, avec sa priorité,
            son critère et un exemple de correction.
        - when: "Mois 2 et 3"
          title: "Accompagner les corrections"
          duration: "1 h par semaine"
          text: >-
            Une permanence pour vos développeurs, sur leurs questions et leurs
            correctifs en cours.
        - when: "Mois 3 ou 4"
          title: "Contre‑auditer"
          duration: "3 à 5 jours"
          text: >-
            Nous revérifions les pages corrigées et mettons à jour votre
            déclaration d’accessibilité.
      specimen: >-
        <div class="obj obj-sheet"><div class="obj-head"><span class="obj-mark"></span><b>Plan de correction</b><span class="obj-push">p. 4 sur 28</span></div>
        <div class="obj-rule"></div>
        <div class="obj-grid" style="--cols:4">
        <span class="is-head">Ticket</span><span class="is-head">Critère</span><span class="is-head">Page</span><span class="is-head">Priorité</span>
        <span>ACC-118</span><span>11.9</span><span>Paiement</span><span class="is-warn">1</span>
        <span>ACC-121</span><span>1.1</span><span>Fiche produit</span><span class="is-warn">1</span>
        <span>ACC-133</span><span>12.8</span><span>Panier</span><span class="is-warn">1</span>
        <span>ACC-140</span><span>3.2</span><span>Pied de page</span><span>2</span>
        <span>ACC-152</span><span>10.7</span><span>Menu</span><span>2</span>
        </div>
        <div class="obj-rule"></div>
        <div class="obj-lines"><i style="--w:88%"></i><i style="--w:64%"></i></div></div>
      specimen_badge: "Spécimen"
      specimen_caption: "Une page du plan de correction remis en semaine 4, sur un site d’exemple."

