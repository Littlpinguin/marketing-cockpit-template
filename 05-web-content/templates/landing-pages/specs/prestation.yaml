        <div class="obj s-hero__doc" aria-hidden="true" data-qa-decor>
        <div class="obj-stack"><div class="obj-sheet">
        <div class="obj-head"><span class="obj-mark"></span><b>ACC-118</b><span class="obj-stamp obj-push">Priorité 1</span></div>
        <div class="obj-rule"></div>
        <p class="obj-title">Le bouton de paiement n’a pas de nom accessible</p>
        <p class="obj-small" style="margin-top:6px">Critère RGAA 11.9 · parcours de commande, page Paiement</p>
        <div class="obj-rule"></div>
        <div class="obj-check"><span class="is-done">Reproduit au clavier</span><span class="is-done">Reproduit au lecteur d’écran</span><span class="is-done">Reproduit sur téléphone</span><span>Corrigé, à vérifier au contre‑audit</span></div>
        <div class="obj-rule"></div>
        <p class="obj-small">Correction proposée</p>
        <p class="obj-small" style="margin-top:6px"><span class="obj-highlight">&lt;button aria-label="Payer ma commande"&gt;</span></p>
        <div class="obj-rule"></div>
        <div class="obj-head"><span>Rapport · 47 tickets</span><span class="obj-push">12 en priorité 1</span></div>
        </div></div>
        <span class="obj-chip s-hero__chip"><i></i>Testé par Samir au lecteur d’écran</span>
        </div>

  - use: problem-pinned
    id: probleme
    slots:
      title: >-
        Ce que l’on nous dit<br><span class="hl">au premier appel</span>
      intro: >-
        Quatre phrases que nous entendons presque mot pour mot, avant de
        parler de devis.
      items:
        - title: "« Une cliente n’a pas pu payer sa commande »"
          text: >-
            Le message arrive au service client, transféré trois fois, et
            personne ne sait reproduire le blocage sans lecteur d’écran.
          visual: >-
            <div class="obj obj-window s-problem__obj"><div class="obj-window__bar"><i></i><i></i><i></i><span>Service client · à traiter</span></div>
            <div class="obj-window__body obj-mail">
            <div class="obj-mail__from"><span class="obj-avatar">MR</span><span><b>Martine R.</b><br>Commande impossible</span></div>
            <div class="obj-lines"><i style="--w:94%"></i><i style="--w:72%"></i></div>
            <p class="obj-small">Avec mon lecteur d’écran, le bouton de paiement <span class="obj-highlight">ne dit rien</span>. J’ai abandonné mon panier.</p>
            <div class="obj-rule"></div>
            <p class="obj-small">Transféré 3 fois · sans réponse</p></div></div>
        - title: "« L’outil automatique sort 412 alertes »"
          text: >-
            La liste mélange vrais blocages et doublons, et ne dit pas ce qui
            empêche un visiteur de commander.
          visual: >-
            <div class="obj obj-window s-problem__obj"><div class="obj-window__bar"><i></i><i></i><i></i><span>Rapport automatique · 412 alertes</span></div>
            <div class="obj-window__body"><div class="obj-grid" style="--cols:2">
            <span class="is-head">Alerte</span><span class="is-head">Nombre</span>
            <span>Contraste insuffisant</span><span class="is-warn">212</span>
            <span>Image sans alternative</span><span class="is-warn">96</span>
            <span>Lien sans intitulé</span><span>58</span>
            <span>Autres</span><span>46</span>
            </div><p class="obj-small" style="margin-top:10px">Dont 9 composants répétés sur chaque page</p></div></div>
        - title: "« Notre agence dit que c’est conforme »"
          text: >-
            La déclaration en ligne annonce un site conforme, sans audit pour
            l’étayer ni date de dernière vérification.
          visual: >-
            <div class="obj obj-sheet s-problem__obj"><div class="obj-head"><span class="obj-mark"></span><b>Déclaration en ligne</b><span class="obj-stamp obj-push">À vérifier</span></div>
            <div class="obj-rule"></div>
            <p class="obj-small">État de conformité : <span class="obj-strike">totalement conforme</span></p>
            <div class="obj-rule"></div>
            <div class="obj-lines"><i style="--w:90%"></i><i style="--w:76%"></i><i style="--w:84%"></i><i style="--w:40%"></i></div>
            <div class="obj-rule"></div>
            <p class="obj-small">Audit joint : aucun · mise à jour : inconnue</p></div>
        - title: "« On ne sait pas quoi corriger en premier »"
          text: >-
            Soixante tickets ouverts sans ordre : les développeurs commencent
            par les plus faciles, et les blocages attendent.
          visual: >-
            <div class="obj obj-window s-problem__obj"><div class="obj-window__bar"><i></i><i></i><i></i><span>Tickets accessibilité · 0 sur 63 traités</span></div>
            <div class="obj-window__body"><div class="obj-check">
            <span>Contraste du pied de page</span><span>Ordre de tabulation du panier</span><span>Alternative du logo</span><span>Captcha du formulaire de contact</span><span>Menu au clavier</span><span>Titre des pages produit</span>
            </div><div class="obj-rule"></div><p class="obj-small">Priorité : <span class="obj-highlight">non renseignée</span></p></div></div>

  - use: program
    id: methode
    slots:
      title: >-
        Cinq étapes<br><span class="hl">du cadrage au contre‑audit</span>
      intro: >-
        Une mission type pour un site de 10 à 25 pages types. Le devis donne
        votre calendrier exact.
      modules:
        - when: "Semaine 1"
          title: "Cadrer l’échantillon"
          duration: "2 h d’atelier"
          text: >-
            Vos parcours clés et une quinzaine de pages types, choisis avec
            vous selon le trafic et les obligations.
        - when: "Semaines 2 et 3"
          title: "Tester à la main et avec des utilisateurs"
          duration: "8 à 12 jours"
          text: >-
            Chaque critère RGAA vérifié page par page, puis les parcours
            rejoués au clavier et au lecteur d’écran.
        - when: "Semaine 4"
          title: "Restituer en tickets"
          duration: "Une demi-journée"
          text: >-
            Chaque défaut devient un ticket dans votre outil, avec sa priorité,
            son critère et un exemple de correction.
        - when: "Mois 2 et 3"
          title: "Accompagner les corrections"
          duration: "1 h par semaine"
          text: >-
            Une permanence pour vos développeurs, sur leurs questions et leurs
            correctifs en cours.
        - when: "Mois 3 ou 4"
          title: "Contre‑auditer"
          duration: "3 à 5 jours"
          text: >-
            Nous revérifions les pages corrigées et mettons à jour votre
            déclaration d’accessibilité.
      specimen: >-
        <div class="obj obj-sheet"><div class="obj-head"><span class="obj-mark"></span><b>Plan de correction</b><span class="obj-push">p. 4 sur 28</span></div>
        <div class="obj-rule"></div>
        <div class="obj-grid" style="--cols:4">
        <span class="is-head">Ticket</span><span class="is-head">Critère</span><span class="is-head">Page</span><span class="is-head">Priorité</span>
        <span>ACC-118</span><span>11.9</span><span>Paiement</span><span class="is-warn">1</span>
        <span>ACC-121</span><span>1.1</span><span>Fiche produit</span><span class="is-warn">1</span>
        <span>ACC-133</span><span>12.8</span><span>Panier</span><span class="is-warn">1</span>
        <span>ACC-140</span><span>3.2</span><span>Pied de page</span><span>2</span>
        <span>ACC-152</span><span>10.7</span><span>Menu</span><span>2</span>
        </div>
        <div class="obj-rule"></div>
        <div class="obj-lines"><i style="--w:88%"></i><i style="--w:64%"></i></div></div>
      specimen_badge: "Spécimen"
      specimen_caption: "Une page du plan de correction remis en semaine 4, sur un site d’exemple."

  - use: cases
    id: cas
    slots:
      title: >-
        Deux sites<br><span class="hl">avant et après l’audit</span>
      intro: >-
        Part des critères RGAA respectés sur les pages de l’échantillon, au
        premier audit puis au contre‑audit.
      dark: true
      before_label: "Premier audit"
      after_label: "Contre‑audit"
      cases:
        - title: "Une boutique de matériel de cuisine"
          context: "Commerce en ligne · cas d’exemple"
          scope: >-
            Dix-huit pages types et le parcours de commande, corrigés en quatre
            mois par l’agence du client avec nos tickets.
          before: "38 %"
          before_v: 0.38
          after: "91 %"
          after_v: 0.91
          quote: "« Pour la première fois, nos développeurs savaient quoi corriger le lundi matin, et dans quel ordre. »"
          author: "Directrice e-commerce (avis fictif)"
        - title: "Le portail famille d’une agglomération"
          context: "Service public local · cas d’exemple"
          scope: >-
            Vingt-quatre pages types, dont l’inscription à la cantine, revues
            en cinq mois avec la collectivité.
          before: "52 %"
          before_v: 0.52
          after: "86 %"
          after_v: 0.86
          quote: "« La déclaration d’accessibilité dit enfin la vérité, dérogations comprises, et les familles nous écrivent moins. »"
          author: "Responsable du numérique (avis fictif)"

