  - use: problem-pinned
    id: probleme
    slots:
      title: "Ce qui fait rater<br><span class=\"hl\">un premier potager</span>"
      intro: "Quatre déconvenues que nous racontent les jardiniers débutants, saison après saison."
      items:
        - title: "Tout est semé le même samedi"
          text: "Le premier beau week-end d’avril, tout part en terre. Fin juin, trente laitues montent en graine en même temps."
          visual: >-
            <div class="obj obj-window s-problem__obj"><div class="obj-window__bar"><i></i><i></i><i></i><span>Carnet de jardin</span></div>
            <div class="obj-window__body"><div class="obj-check">
            <span class="is-done">Samedi 10 avril · 30 laitues</span>
            <span class="is-done">Samedi 10 avril · 2 rangs de radis</span>
            <span class="is-done">Samedi 10 avril · 6 pieds de courgette</span>
            <span class="is-done">Samedi 10 avril · carottes</span>
            </div><div class="obj-rule"></div><p><span class="obj-stamp">Tout le même jour</span></p></div></div>
        - title: "Les limaces passent avant vous"
          text: "Les jeunes plants disparaissent en une nuit, juste après la pluie, faute d’avoir été protégés à temps."
          visual: >-
            <div class="obj obj-sheet s-problem__obj"><div class="obj-head"><span class="obj-mark"></span><b>Plan du carré · mai</b></div><div class="obj-rule"></div>
            <div class="obj-grid" style="--cols:4"><span class="is-warn">Mangée</span><span class="is-warn">Mangée</span><span>Radis</span><span class="is-warn">Mangée</span>
            <span>Carotte</span><span>Oignon</span><span class="is-warn">Mangé</span><span>Persil</span></div>
            <div class="obj-rule"></div><p class="obj-small">Nuit du 12 mai, après la pluie</p></div>
        - title: "Six courgettes pour deux personnes"
          text: "En août, le carré déborde de ce que personne ne mange, et il ne reste de place pour rien d’autre."
          visual: >-
            <div class="obj obj-sheet s-problem__obj"><div class="obj-head"><span class="obj-mark"></span><b>Récoltes d’août</b></div><div class="obj-rule"></div>
            <div class="obj-bars"><div class="obj-bar is-hl" style="--v:.82"><span>Courgettes</span><span class="obj-bar__track"><i class="obj-bar__fill"></i></span><b>82 %</b></div>
            <div class="obj-bar" style="--v:.12"><span>Tomates</span><span class="obj-bar__track"><i class="obj-bar__fill"></i></span><b>12 %</b></div>
