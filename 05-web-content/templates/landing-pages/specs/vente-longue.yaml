        role: Retraité, quatre carrés en Auvergne (avis fictif)
        initials: GP
        video:
          src: "https://www.example.com/videos/saison-gerard.mp4"
          poster: ''
          duration: 1 min 32
          captions: "https://www.example.com/videos/saison-gerard.vtt"
          transcript: Je jardine depuis longtemps, mais toujours en rangs. Le carré, c’était nouveau. Le plan m’a dit quoi mettre dans chaque case, et surtout quand. Les tomates sont parties deux semaines plus tard que d’habitude, et pour la première fois je n’ai rien perdu en mai.
