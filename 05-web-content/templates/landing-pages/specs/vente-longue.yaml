        name: Inès D.
        role: Jardin partagé dans le Nord (avis fictif)
        initials: ID
      - result: ''
        quote: Dix minutes le lundi matin avec mon café, et je savais ce que j’avais à faire dans la semaine. Je n’ai jamais eu besoin de chercher ailleurs.
        name: Romain S.
        role: Deux carrés, maison en Bretagne (avis fictif)
        initials: RS
      - result: Plus de limaces sur les salades
        quote: La fiche sur les protections m’a fait poser les planches avant la pluie. Les années précédentes, je découvrais les dégâts le lendemain.
        name: Chantal M.
        role: Jardin familial en Gironde (avis fictif)
        initials: CM
      - result: Un carré pensé pour les enfants
        quote: Le plan a mis les fraises et les radis du côté où les enfants passent. Ils allaient voir chaque matin si quelque chose avait poussé.
        name: Julie B.
        role: Mère de deux enfants, jardin en ville (avis fictif)
        initials: JB
      - result: ''
        quote: Le groupe d’entraide m’a sauvé en juin, quand mes courgettes jaunissaient. Une réponse en une heure, photo à l’appui.
        name: Hervé T.
        role: Première saison, Alsace (avis fictif)
        initials: HT
      - result: Le calendrier collé dans l’abri
        quote: Le calendrier imprimé est resté punaisé dans l’abri toute l’année. Je cochais les semis au crayon, et je l’ai gardé pour la saison prochaine.
        name: Martine F.
        role: Retraitée, potager en Normandie (avis fictif)
        initials: MF
      - result: ''
        quote: J’avais peur que le plan ne tienne pas compte de l’ombre du noisetier. Il en tenait compte, et les salades sont allées de ce côté.
        name: Laurent G.
        role: Carré à mi-ombre, Isère (avis fictif)
        initials: LG
      - result: Trois paniers de haricots en août
        quote: Je n’en avais jamais récolté autant sur si peu de place. Le semis en deux fois, conseillé dans la lettre de mai, a tout changé.
        name: Nadia K.
        role: Deuxième saison, Lyon (avis fictif)
        initials: NK
      - result: ''
        quote: Les lettres sont courtes et on sent qu’elles sont écrites par quelqu’un qui jardine vraiment. Pas de jargon, des gestes.
        name: Pierre-Yves C.
        role: Jardin ouvrier, Lille (avis fictif)
        initials: PC
      - result: Une saison réussie malgré un mois de juin pluvieux
        quote: Quand il a plu trois semaines, la lettre a changé le programme et proposé de semer sous voile. Le carré est reparti en juillet.
        name: Sylvie R.
        role: Carré surélevé, Vosges (avis fictif)
        initials: SR
      fold_after: 6
      more_label: Lire les {n} autres avis
      less_label: Replier les avis
