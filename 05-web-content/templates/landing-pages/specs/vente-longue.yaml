  - use: faq
    id: questions
    slots:
      title: "Vos questions <span class=\"hl\">avant de commencer</span>"
      intro: ""
      jsonld: false
      items:
        - q: "Faut‑il déjà savoir jardiner ?"
          a: "Non. Les lettres partent du principe que c’est votre première saison, et chaque fiche explique les gestes de base."
        - q: "Combien de temps faut‑il y passer ?"
          a: "Dix minutes pour lire la lettre du lundi, puis une heure au jardin dans la semaine. Comptez un peu plus en mai, au moment des plantations."
        - q: "Et si mon carré est plus petit ?"
          a: "Le plan s’adapte à vos mesures, à partir d’un mètre de côté. Pour plusieurs carrés, indiquez-les tous dans le questionnaire."
        - q: "Les dates valent‑elles pour ma région ?"
          a: "Le calendrier tient compte de votre code postal. Les dates de semis et de plantation se décalent selon votre climat."
        - q: "Que se passe‑t‑il après septembre ?"
          a: "Vous gardez le plan, les fiches et les lettres. L’inscription à la saison suivante n’est jamais automatique."
        - q: "Le calendrier est‑il livré partout ?"
          a: "En France métropolitaine et en Belgique, sans frais. Ailleurs, vous le recevez en PDF à imprimer."
      card_label: "La saison"
      card_title: "La Saison du Carré 2027"
