# ============================================================================
# Modèle de landing « vente-longue » : une seule offre achetée en ligne
# ----------------------------------------------------------------------------
# Conversion unique : l'envoi du ticket vers l'outil de paiement (événement
# begin_checkout, avec la formule, la valeur, la devise et les articles du
# ticket). Le ticket vend la saison complète ou une sélection à l'unité :
# formule « saison-2027 » ou « a-l-unite » (champ articles). Tous les CTA de
# la page (barre du haut, hero, carte de la FAQ, CTA final, barre mobile)
# mènent à l'ancre #offre, qui porte le ticket.
#
# Assembler (depuis la racine du dépôt) :
#   python3 05-web-content/scripts/assemble-landing.py 05-web-content/templates/landing-pages/specs/vente-longue.yaml
#   python3 05-web-content/scripts/qa-landing.py 05-web-content/templates/landing-pages/vente-longue.html
# Pour une vraie page : copier cette spec dans
# 05-web-content/landing-pages/<slug>/pilotage/page.yaml, changer « output »,
# réécrire chaque texte (skills copywriting puis copy-editing) et dérouler la
# skill landing-page.
#
# CONTENU FICTIF. La marque « Terre Voisine », son programme « La Saison du
# Carré », les avis, les chiffres, les dates et le prix sont inventés pour la
# démonstration. Aucun ne se publie tel quel : chaque chiffre vient de
# 01-brand/messaging-framework.md ou d'une source citée, le tableau comparatif
# se vérifie et se date, chaque avis est réel et signé avec l'accord de son
# auteur.
#
# Archétype : un programme saisonnier vendu en ligne au grand public (un
# produit numérique, une part de service et un objet livré), à paiement
# unique. Pour une formation en cohorte ou un atelier daté, partir plutôt du
# modèle « formation ».
#
# Récit (une objection par section, dans l'ordre de la pensée du visiteur) :
#   hero        De quoi s'agit-il, pour qui, jusqu'à quand : le plan du carré,
#               objet signature, repris dans le problème et le parcours.
#   sommaire    Où en suis-je, où est ce qui m'intéresse : sept chapitres en
#               liens d'ancre, puis un rail dans la marge (dès 1101 px) ou une
#               barre « Chapitre n sur 7 » qui suit la lecture (chapters).
#               Chaque chapitre vise un id de la page : renommer un id, c'est
#               corriger le sommaire.
#   preuves     Est-ce sérieux : les faits de l'offre, pas des statistiques.
#   probleme    Pourquoi maintenant : quatre déconvenues de premier potager
#               (épinglé, 55 vh par constat).
#   pivot       Et donc : une phrase, puis l'offre comme réponse (épinglé).
#   kit         Qu'est-ce que je reçois : bande sombre. Placé entre le pivot
#               et le parcours pour que deux épinglages ne se suivent pas sans
#               respiration.
#   parcours    Concrètement, que fais-je : cinq temps de février à octobre
#               (épinglé, 60 vh par étape), une jauge « Lettre n sur 32 »
#               dans la marge.
#   resultats   Qu'est-ce que ça change : respiration sans carte.
#   avis        D'autres l'ont-ils fait, et sont-ils nombreux : douze avis dont
#               six repliés, une note moyenne avec son effectif et sa source,
#               un témoignage vidéo sous-titré avec sa transcription (wall).
#   comparatif  Pourquoi cette option : tableau daté, catégories et non marques.
#   pour-qui    Est-ce pour moi : le volet « pas pour vous » qualifie.
#   offre       Combien à l'unité, combien en saison complète : le ticket se
#               remplit à chaque case et propose la saison dès qu'elle revient
#               moins cher (bundle-receipt ; les prix à l'unité sont la vraie
#               somme de prix pratiqués, jamais gonflés pour fabriquer une
#               économie).
#   garantie    Et si ça ne me sert pas : sceau et conditions exactes.
#   questions   Les dernières questions, carte collante vers le ticket.
#   final       Je passe à l'action : bande sombre, rideau.
# Épinglages : probleme, pivot, parcours (3 au plus, ~6,5 écrans captifs).
# Le couple probleme → pivot suit la composition de la bibliothèque ; le
# pivot, une phrase seule à l'écran, sert de respiration.
#
# À BRANCHER avant publication (marqueurs en majuscules, signalés par la QA) :
#   {{URL_CHECKOUT}}           page de paiement de votre outil de vente en
#                              ligne : le ticket y part en GET avec
#                              ?formule=… (et ?articles=… pour une sélection
#                              à l'unité) et les UTM de la visite.
#   {{URL_LISTE_ATTENTE}}      formulaire « être prévenu de la saison
#                              suivante », utilisé une fois closes_at passée
#                              (état waitlist) et par le lien de l'état closed.
#   {{URL_MENTIONS_LEGALES}}, {{URL_CGV}}, {{URL_CONFIDENTIALITE}}  pied de page
#   bonjour@example.com        adresse de contact (garantie, FAQ, pied)
# État de l'offre : la clé « offer » ci-dessous est la seule configuration.
# closes_at est la vraie date de clôture des inscriptions : le hero et le
# ticket comptent les jours restants (jamais les secondes), puis la page passe
# d'elle-même à after_close. Mettre à jour les dates écrites dans les textes
# (hero, ticket, parcours, garantie, FAQ, final, barre mobile) en même temps.
# Prix : ceux du ticket (à l'unité et saison complète) se reprennent tels
# quels dans le sommaire, le comparatif, la carte de la FAQ et la barre
# mobile. Une offre vendue en une seule formule prend offer-ticket à la place
# du ticket (voir specs/formation.yaml).
# Mesure : tracking.mode datalayer par défaut. Passer en « gtm » (gtm: GTM-…)
# ou « gtag » (ga4: G-…), puis marquer begin_checkout (et purchase, côté
# outil de paiement) comme conversions clés dans GA4.
# ============================================================================

