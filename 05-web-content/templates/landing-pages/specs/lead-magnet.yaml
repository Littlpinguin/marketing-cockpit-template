# ============================================================================
# Modèle de landing « lead-magnet » : une ressource gratuite contre un email
# ----------------------------------------------------------------------------
# Conversion unique : l'envoi du formulaire de capture (événement generate_lead).
# Tous les CTA de la page (barre du haut, hero, carte de la FAQ, CTA final)
# mènent à l'ancre #recevoir, qui porte le formulaire.
#
# Assembler (depuis la racine du dépôt) :
#   python3 05-web-content/scripts/assemble-landing.py 05-web-content/templates/landing-pages/specs/lead-magnet.yaml
#   python3 05-web-content/scripts/qa-landing.py 05-web-content/templates/landing-pages/lead-magnet.html
# Pour une vraie page : copier cette spec dans
# 05-web-content/landing-pages/<slug>/pilotage/page.yaml, changer « output »
# vers 05-web-content/landing-pages/<slug>/index.html, réécrire chaque texte
# (skills copywriting puis copy-editing) et dérouler la skill landing-page.
#
# CONTENU FICTIF. La marque « Encaisse » (atelier de trésorerie pour
# indépendants), ses deux autrices, le kit et ses chiffres sont inventés pour
# la démonstration. Aucun ne se publie tel quel : chaque chiffre vient de
# 01-brand/messaging-framework.md ou d'une source citée, chaque personne donne
# son accord (01-brand/droits.md).
#
# Récit (une objection par section, dans l'ordre de la pensée du visiteur) :
#   hero        De quoi s'agit-il, pour qui : la ressource montrée en objet
#               (le kit ouvert sur un modèle d'email, le calendrier coché).
#   recevoir    Qu'est-ce que je donne, qu'est-ce que je reçois : l'email seul,
#               et le kit part par email, sans case à cocher (la demande vaut
#               envoi). La lettre se propose à part, dans une case facultative
#               et décochée ; la phrase sous le bouton dit ce qui suit.
#   contenu     Qu'y a-t-il dedans, exactement : les six relances sur un rail,
#               de J+1 à J+45, et une vraie page du kit en spécimen.
#   pour-qui    Est-ce pour moi : clients professionnels oui, particuliers non.
#   auteures    Qui l'a écrit, est-ce sérieux : la praticienne et l'avocate.
#   questions   Les dernières questions : gratuité, confirmation, format, données.
#   final       Je passe à l'action : bande sombre, retour au formulaire.
#
# À BRANCHER avant publication (marqueurs en majuscules, signalés par la QA) :
#   {{FORM_ENDPOINT}}          endpoint POST du formulaire : webhook n8n ou
#                              formulaire de l'outil d'emailing (skill
#                              lead-magnet, § 5). Le circuit envoie le kit à
#                              l'adresse donnée ; si la case « newsletter »
#                              est cochée (champ newsletter=oui), il inscrit à
#                              la lettre avec un email de confirmation.
#                              Tant que le marqueur reste, l'envoi est une
#                              démonstration : rien ne part, la mesure compte
#                              form_demo_submit et non generate_lead.
#   {{URL_MENTIONS_LEGALES}}   page des mentions légales (pied de page)
#   {{URL_CONFIDENTIALITE}}    politique de confidentialité (pied de page)
#   bonjour@example.com        adresse de contact (carte de la FAQ, pied)
# Mesure : tracking.mode datalayer par défaut (les événements attendent un
# conteneur). Passer en « gtm » avec gtm: GTM-XXXX, ou en « gtag » avec
# ga4: G-XXXX, puis marquer generate_lead comme conversion clé dans GA4.
# Les UTM de la visite partent en champs cachés avec le formulaire.
# Visibilité : noindex par défaut ; « index, follow » pour une ressource
# pérenne, avec canonical et og:image.
# ============================================================================

output: 05-web-content/templates/landing-pages/lead-magnet.html
