<script data-section-script="chapters">
/* Table of contents that follows the reading.
   principe : scrollspy par IntersectionObserver, sans écouteur de
   défilement ; aria-current posé par le script, parce que :target-current
   colore sans rien dire aux technologies d'assistance.
   - The current chapter is the last listed section whose top has passed a
     reading line at 40 % of the screen (the last one in view at the very
     bottom of the page). It is computed only when an observer reports a
     crossing, never on every scroll frame.
   - The following table of contents (rail or bar) shows once the in-flow
     list has gone above the screen. The rail yields the margin to a dark
     band and to a section that carries a narrative gauge.
   - Reading progress per chapter: view timelines named on the chapter
     sections, where supported and motion is allowed. */
(function () {
  'use strict';
  if (window.__landingChapters || !('IntersectionObserver' in window)) return;
  window.__landingChapters = true;

  var root = document.documentElement;
  var LINE = 0.4;
  var mqWide = window.matchMedia('(min-width: 1101px)');
  var mqMotion = window.matchMedia('(prefers-reduced-motion: no-preference)');

  function topbar() {
    return parseFloat(getComputedStyle(root).getPropertyValue('--topbar-h')) || 0;
  }

  function hiddenTarget(el) {
    return !el || !!el.closest('[hidden]');
  }

  function setup(toc) {
    var float = document.getElementById(toc.id + '-suivi');
    var chapters = Array.prototype.map.call(toc.querySelectorAll('.s-chapters__link'), function (a, i) {
      var id = (a.getAttribute('href') || '').slice(1);
      try { id = decodeURIComponent(id); } catch (e) {}
      var rlink = float ? float.querySelectorAll('.s-chapters__rlink')[i] : null;
      var label = a.querySelector('.s-chapters__label');
      return {
        id: id,
        target: document.getElementById(id),
        links: rlink ? [a, rlink] : [a],
        item: rlink ? rlink.parentElement : null,
        fill: rlink ? rlink.querySelector('.s-chapters__fill') : null,
        label: (label || a).textContent.trim()
      };
    });
    if (!chapters.length) return;

    var current = -2;
    var tocPassed = false;
    var open = false;
    var zones = new Map();
    var frame = 0;
    var toggle = float && float.querySelector('.s-chapters__toggle');
    var count = float && float.querySelector('.s-chapters__count');
    var now = float && float.querySelector('.s-chapters__now');
    var meter = float && float.querySelector('.s-chapters__meter');
    var names = [];
    var progressOn = false;

    function setCurrent(i) {
      if (i === current) return;
      current = i;
      chapters.forEach(function (c, j) {
        c.links.forEach(function (a) {
          if (j === i) a.setAttribute('aria-current', 'true'); else a.removeAttribute('aria-current');
        });
        if (c.item) c.item.toggleAttribute('data-passed', i >= 0 && j < i);
      });
      if (count) {
        count.textContent = (count.getAttribute('data-count') || '')
          .replace('{n}', String(i + 1)).replace('{total}', String(chapters.length));
      }
      if (now) now.textContent = i >= 0 ? chapters[i].label : '';
      if (meter && progressOn) meter.style.animationTimeline = i >= 0 && names[i] ? names[i] : 'none';
    }

    function render() {
      if (!float) return;
      var show = tocPassed && current >= 0;
      if (mqWide.matches) {
        // A dark band always; a live gauge only while it shows (scroll theatre).
        var pinOn = root.classList.contains('sc-pin');
        var blocked = false;
        zones.forEach(function (z) { if (z.on && (z.kind === 'dark' || pinOn)) blocked = true; });
        show = show && window.innerHeight >= 600 && !blocked;
      } else {
        show = show && float.hasAttribute('data-bar');
      }
      // Never hide what holds the focus, nor the open list.
      if (!show && (open || float.contains(document.activeElement)) && tocPassed && current >= 0) show = true;
      float.toggleAttribute('data-visible', show);
      if (!show && open) setOpen(false);
    }

    function compute() {
      frame = 0;
      var vh = window.innerHeight;
      var line = vh * LINE;
      var cur = -1;
      chapters.forEach(function (c, i) {
        if (hiddenTarget(c.target)) return;
        if (c.target.getBoundingClientRect().top <= line) cur = i;
      });
      if (window.scrollY + vh >= root.scrollHeight - 2) {
        chapters.forEach(function (c, i) {
          if (!hiddenTarget(c.target) && c.target.getBoundingClientRect().top < vh) cur = Math.max(cur, i);
        });
      }
      setCurrent(cur);
      tocPassed = toc.getBoundingClientRect().bottom <= topbar() + 1;
      render();
    }

    function schedule() {
      if (!frame) frame = window.requestAnimationFrame(compute);
    }

    // While the list is open (and only then), scrolling the page on by more
    // than a line closes it: it never stays over the text being read.
    var openedAt = 0;
    function onScrollWhileOpen() {
      if (Math.abs(window.scrollY - openedAt) > 48) setOpen(false);
    }

    function setOpen(v) {
      if (v === open) return;
      open = v;
      if (!toggle) return;
      toggle.setAttribute('aria-expanded', v ? 'true' : 'false');
      float.toggleAttribute('data-open', v);
      if (v) {
        openedAt = window.scrollY;
        window.addEventListener('scroll', onScrollWhileOpen, { passive: true });
      } else {
        window.removeEventListener('scroll', onScrollWhileOpen);
      }
    }

    // Crossings of the reading line, entries and exits of the screen.
    var ioLine = new IntersectionObserver(schedule, { rootMargin: '-40% 0px -60% 0px' });
    var ioView = new IntersectionObserver(schedule);
    var ioToc = new IntersectionObserver(schedule, { rootMargin: '-' + Math.round(topbar()) + 'px 0px 0px 0px' });
    function watch() {
      chapters.forEach(function (c) {
        c.target = document.getElementById(c.id);
        if (c.target) { ioLine.observe(c.target); ioView.observe(c.target); }
      });
    }
    watch();
    ioToc.observe(toc);
    var end = document.querySelector('.s-footer, body > footer');
    if (end) ioView.observe(end);

    // The rail gives way to dark bands and to narrative gauges (both use
    // the page margin or paint it).
    if (float) {
      var ioZone = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          var z = zones.get(e.target);
          if (z) z.on = e.isIntersecting;
        });
        render();
      }, { rootMargin: '-25% 0px -25% 0px' });
      var addZone = function (el, kind) {
        if (!el || zones.has(el)) return;
        zones.set(el, { on: false, kind: kind });
        ioZone.observe(el);
      };
      document.querySelectorAll('section.band-dark, .section.band-dark').forEach(function (el) { addZone(el, 'dark'); });
      document.querySelectorAll('.gauge--live, [data-gauge]').forEach(function (g) {
        addZone(g.closest('section') || g, 'gauge');
      });
    }

    // Reading progress per chapter (view timelines), motion allowed only.
    if (float && float.hasAttribute('data-progress') && mqMotion.matches && window.CSS && CSS.supports &&
        CSS.supports('animation-timeline: view()')) {
      var base = '--' + (toc.id || 'chapters').replace(/[^A-Za-z0-9_-]/g, '') + '-ch';
      chapters.forEach(function (c, i) {
        if (!c.target) return;
        var taken = getComputedStyle(c.target).getPropertyValue('view-timeline-name').trim();
        if (taken && taken !== 'none') return;
        names[i] = base + i;
        c.target.style.setProperty('view-timeline-name', names[i]);
        if (c.fill) c.fill.style.animationTimeline = names[i];
      });
      var used = names.filter(Boolean);
      if (used.length) {
        var scope = getComputedStyle(document.body).getPropertyValue('timeline-scope').trim();
        document.body.style.setProperty('timeline-scope', (scope && scope !== 'none' ? scope + ', ' : '') + used.join(', '));
        float.setAttribute('data-progress-on', '');
        progressOn = true;
      }
    }

    if (float) {
      if (toggle) toggle.addEventListener('click', function () { setOpen(!open); render(); });
      float.addEventListener('click', function (e) {
        if (open && e.target.closest('.s-chapters__rlink')) setOpen(false);
      });
      float.addEventListener('focusout', function (e) {
        if (open && !float.contains(e.relatedTarget)) setOpen(false);
        window.requestAnimationFrame(render);
      });
      float.addEventListener('focusin', function () { float.removeAttribute('data-quiet'); });
      float.addEventListener('pointerleave', function () { float.removeAttribute('data-quiet'); });
      document.addEventListener('click', function (e) {
        if (open && !float.contains(e.target)) setOpen(false);
      });
      document.addEventListener('keydown', function (e) {
        if (e.key !== 'Escape' && e.key !== 'Esc') return;
        if (open) { setOpen(false); if (toggle) toggle.focus(); return; }
        // Escape dismisses a title shown on hover or focus (WCAG 1.4.13).
        if (float.matches(':hover') || float.contains(document.activeElement)) float.setAttribute('data-quiet', '');
      });
      float.hidden = false;
    }

    [mqWide, mqMotion].forEach(function (mq) {
      if (mq.addEventListener) mq.addEventListener('change', schedule); else mq.addListener(schedule);
    });
    window.addEventListener('resize', schedule);
    document.addEventListener('landing:revealed', function () { watch(); schedule(); });
    schedule();
  }

  function start() {
    document.querySelectorAll('[data-chapters]').forEach(setup);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>
