<style data-section-style="footer">
.s-footer {
  padding: 40px 0;
  border-top: 1px solid var(--line);
}

.s-footer__inner {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 16px 32px;
}

.s-footer__brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-size: 1.0625rem;
  font-weight: 800;
  letter-spacing: -0.02em;
}

.s-footer__mark {
  width: 26px;
  height: 26px;
  color: var(--hl);
}

.s-footer__links {
  display: flex;
  flex-wrap: wrap;
  gap: 0 24px;
}

.s-footer__links a {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  color: var(--ink);
  font-size: var(--t-small);
  font-weight: 500;
}

.s-footer__legal {
  flex-basis: 100%;
  color: var(--muted);
  font-size: var(--t-small);
}
</style>
<!-- section:{{id}} -->
<footer id="{{id}}" class="s-footer" data-section="footer">
  <div class="wrap s-footer__inner">
    <p class="s-footer__brand">{{{brand}}}</p>
    <ul class="s-footer__links" role="list">{{#links}}<li><a href="{{href}}">{{label}}</a></li>{{/links}}</ul>
    <p class="s-footer__legal">{{legal}}</p>
  </div>
</footer>
