<style data-section-style="topbar">
.s-topbar {
  position: sticky;
  top: 0;
  z-index: 60;
  height: var(--topbar-h);
  border-bottom: 1px solid var(--line);
  background: var(--brand-light);
}

.s-topbar__inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  height: 100%;
}

.s-topbar__brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  color: var(--ink);
  font-size: 1.1875rem;
  font-weight: 800;
  letter-spacing: -0.02em;
}

.s-topbar__brand img {
  height: 32px;
  width: auto;
}

.s-topbar__mark {
  width: 30px;
  height: 30px;
  color: var(--hl);
}

.s-topbar__cta.btn {
  min-height: 44px;
  padding: 8px 22px;
  font-size: 0.9375rem;
}
</style>
<!-- section:{{id}} -->
<header id="{{id}}" class="s-topbar" data-section="topbar">
  <div class="wrap s-topbar__inner">
    <p class="s-topbar__brand">{{{brand}}}</p>
    <a class="btn btn--secondary s-topbar__cta" href="{{cta_href}}" data-track="cta_click" data-cta-position="topbar"{{#primary}} data-cta="primaire"{{/primary}}>{{cta_label}}</a>
  </div>
</header>
<!-- /section:{{id}} -->
