<style data-section-style="faq">
.s-faq__grid {
  display: grid;
  grid-template-columns: minmax(0, 1.5fr) minmax(0, 0.9fr);
  gap: clamp(32px, 1rem + 4vw, 88px);
  align-items: start;
}

.s-faq__list {
  border-top: 1px solid var(--line);
}

.s-faq__item {
  border-bottom: 1px solid var(--line);
}

.s-faq__q {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  min-height: 64px;
  padding: 18px 0;
  cursor: pointer;
  list-style: none;
}

.s-faq__q::-webkit-details-marker {
  display: none;
}

.s-faq__q h3 {
  font-size: 1.1875rem;
  line-height: var(--lh-snug);
  font-weight: 700;
  text-wrap: balance;
}

.s-faq__icon {
  position: relative;
  flex: none;
  width: 32px;
  height: 32px;
  border: 1.5px solid var(--line-strong);
  border-radius: 50%;
  transition: transform var(--dur-fast) var(--ease), background-color var(--dur-fast) var(--ease);
}

.s-faq__icon::before,
.s-faq__icon::after {
  content: "";
  position: absolute;
  top: 50%;
  left: 50%;
  width: 12px;
  height: 2px;
  margin: -1px 0 0 -6px;
  border-radius: 2px;
  background: var(--ink);
}

.s-faq__icon::after {
  transform: rotate(90deg);
  transition: transform var(--dur-fast) var(--ease);
}

.s-faq__item[open] .s-faq__icon {
  border-color: var(--brand-primary);
  background: var(--tint);
}

.s-faq__item[open] .s-faq__icon::after {
  transform: rotate(0deg);
}

.s-faq__a {
  max-width: 62ch;
  padding: 0 52px 24px 0;
  color: var(--muted);
  text-wrap: pretty;
}

.s-faq__card {
  position: sticky;
  top: calc(var(--topbar-h) + 32px);
  display: grid;
  gap: 12px;
  padding: clamp(24px, 1rem + 1.4vw, 36px);
}

.s-faq__card::before {
  content: "";
  position: absolute;
  top: -1px;
  left: 24px;
  right: 24px;
  height: 4px;
  border-radius: 0 0 4px 4px;
  background: var(--gradient);
}

.s-faq__card-title {
  font-size: 1.375rem;
  line-height: 1.25;
  font-weight: 800;
  letter-spacing: -0.015em;
}

.s-faq__card-meta {
  color: var(--muted);
}

.s-faq__card .btn {
  margin-top: 8px;
}

.s-faq__contact {
  color: var(--muted);
  font-size: var(--t-small);
}

@media (max-width: 1100px) {
  .s-faq__grid {
    grid-template-columns: minmax(0, 1fr);
  }

  .s-faq__card {
    position: static;
    max-width: 520px;
  }
}
</style>
<!-- section:{{id}} -->
<section id="{{id}}" class="s-faq section" aria-labelledby="{{id}}-titre" data-section="faq">
  <div class="wrap s-faq__grid">
    <div>
      <div class="section-head">
        <h2 id="{{id}}-titre" class="section-title">{{{title}}}</h2>
        {{#intro}}<p class="section-intro">{{intro}}</p>{{/intro}}
      </div>
      <div class="s-faq__list"{{#jsonld}} data-faq-jsonld{{/jsonld}}>
        {{#items}}<details class="s-faq__item" data-track="faq_open">
          <summary class="s-faq__q"><h3>{{q}}</h3><span class="s-faq__icon" aria-hidden="true"></span></summary>
          <div class="s-faq__a"><p>{{a}}</p></div>
        </details>{{/items}}
      </div>
    </div>
    <aside class="s-faq__card card" aria-labelledby="{{id}}-carte">
      <p class="label">{{card_label}}</p>
      <p id="{{id}}-carte" class="s-faq__card-title">{{card_title}}</p>
      <p class="s-faq__card-meta">{{card_meta}}</p>
      <a class="btn btn--secondary btn--block" href="{{cta_href}}" data-track="cta_click" data-cta-position="faq">{{cta_label}}</a>
      <p class="s-faq__contact">{{{contact}}}</p>
    </aside>
  </div>
</section>
<!-- /section:{{id}} -->
<script data-section-script="faq">
(function () {
  // FAQPage JSON-LD built from the visible questions (indexed pages only).
  document.querySelectorAll('.s-faq__list[data-faq-jsonld]').forEach(function (list) {
    var entities = Array.prototype.map.call(list.querySelectorAll('details'), function (d) {
      var q = d.querySelector('summary');
      var a = d.querySelector('.s-faq__a');
      return { '@type': 'Question', name: q ? q.textContent.trim() : '',
               acceptedAnswer: { '@type': 'Answer', text: a ? a.textContent.trim() : '' } };
    });
    var script = document.createElement('script');
    script.type = 'application/ld+json';
    script.textContent = JSON.stringify({ '@context': 'https://schema.org', '@type': 'FAQPage', mainEntity: entities });
    document.head.appendChild(script);
  });
})();
</script>
