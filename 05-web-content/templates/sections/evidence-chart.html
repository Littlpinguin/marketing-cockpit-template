<style data-section-style="evidence-chart">
/* The poster figure is cut by the bottom edge of the section. */
.s-chart {
  overflow: clip;
}

.s-chart__grid {
  display: grid;
  grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
  gap: clamp(40px, 1rem + 5vw, 104px);
}

.s-chart__aside {
  display: flex;
  flex-direction: column;
}

.s-chart__head {
  margin-bottom: 0;
}

/* V10 : un chiffre en affiche, coupé par le bord de la section. Static (a
   gradient clipped to text is lost on a transformed element). The box
   ends 0.17em under the section's edge: about a fifth of the digits is
   cut, the rest reads whole. The negative inline margin lines the ink of
   the first glyph up with the title (side bearing of a 12rem glyph). */
.s-chart__poster {
  align-self: flex-start;
  margin-top: auto;
  margin-inline-start: -0.05em;
  margin-bottom: calc(-1 * var(--section-gap) - 0.17em);
  padding-top: 32px;
  font-size: clamp(8rem, 3rem + 10vw, 15rem);
  line-height: 0.8;
  font-weight: 800;
  letter-spacing: -0.06em;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  color: transparent;
  background: var(--gradient);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-user-select: none;
  user-select: none;
  pointer-events: none;
}

.s-chart__figure {
  display: grid;
  gap: 22px;
  align-self: start;
  padding: clamp(24px, 1rem + 1.6vw, 40px);
}

.s-chart__measure {
  font-weight: 700;
  line-height: 1.4;
  text-wrap: balance;
}

.s-chart__bars {
  display: grid;
  gap: clamp(16px, 0.7rem + 0.6vw, 22px);
  padding-top: 22px;
  border-top: 1px solid var(--line);
}

.s-chart__row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  grid-template-areas:
    "label value"
    "track track";
  gap: 8px 16px;
  align-items: baseline;
}

.s-chart__label {
  grid-area: label;
  color: var(--muted);
  line-height: 1.35;
}

.s-chart__value {
  grid-area: value;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.s-chart__track {
  grid-area: track;
  display: block;
  height: 14px;
  overflow: hidden;
  border-radius: calc(var(--radius-input) / 4);
  background: var(--surface-2);
}

/* The bar is the value itself: its length is --v % of the track. */
.s-chart__fill {
  display: block;
  width: calc(var(--v, 100) * 1%);
  max-width: 100%;
  height: 100%;
  background: var(--line-strong);
  transform-origin: 0 50%;
  transition: transform 0.9s var(--ease);
  transition-delay: calc(var(--rv-i, 0) * 0.12s + 0.15s);
}

/* The one bar the title speaks of: ink label, bold value, highlight fill.
   Weight carries the emphasis too, never the colour alone. */
.s-chart__row[data-focus] .s-chart__label {
  color: var(--ink);
  font-weight: 700;
}

.s-chart__row[data-focus] .s-chart__value {
  color: var(--hl);
  font-size: 1.25em;
  font-weight: 800;
  letter-spacing: -0.01em;
}

.s-chart__row[data-focus] .s-chart__fill {
  background: var(--hl);
}

/* Bars grow when their row enters (reveal.js); final width without the
   engine, without JavaScript and in reduced motion. */
.rv-on .s-chart__row:not(.is-in) .s-chart__fill {
  transform: scaleX(0);
}

.s-chart__reading {
  color: var(--muted);
  text-wrap: pretty;
}

.s-chart__source {
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: var(--t-small);
  line-height: 1.45;
}

@media (max-width: 1100px) {
  .s-chart__grid {
    grid-template-columns: minmax(0, 1fr);
    gap: 0;
  }

  .s-chart__head {
    margin-bottom: var(--head-gap);
  }

  .s-chart__poster {
    display: none;
  }

  .s-chart__figure {
    max-width: 760px;
  }
}
</style>
<!-- section:{{id}} -->
<section id="{{id}}" class="s-chart section" aria-labelledby="{{id}}-titre" data-section="evidence-chart">
  <div class="wrap s-chart__grid">
    <div class="s-chart__aside">
      <div class="section-head s-chart__head">
        <h2 id="{{id}}-titre" class="section-title">{{{title}}}</h2>
        {{#intro}}<p class="section-intro">{{intro}}</p>{{/intro}}
      </div>
      {{#poster}}<p class="s-chart__poster" aria-hidden="true" data-qa-decor>{{poster}}</p>{{/poster}}
    </div>
    <figure class="s-chart__figure card">
      <figcaption class="s-chart__measure">{{measure}}</figcaption>
      <ol class="s-chart__bars" role="list" data-reveal-group>
        {{#bars}}<li class="s-chart__row"{{#focus}} data-focus{{/focus}} style="--v: {{bar}}" data-reveal="fade">
          <span class="s-chart__label">{{label}}</span>
          <span class="s-chart__value"{{#focus}}{{#focus_mark}} data-annotate="{{focus_mark}}"{{/focus_mark}}{{/focus}}>{{value}}</span>
          <span class="s-chart__track" aria-hidden="true"><span class="s-chart__fill"></span></span>
        </li>{{/bars}}
      </ol>
      {{#reading}}<p class="s-chart__reading">{{reading}}</p>{{/reading}}
      <p class="s-chart__source">{{source}}</p>
    </figure>
  </div>
</section>
<!-- /section:{{id}} -->
