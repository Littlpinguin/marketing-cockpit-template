<style data-section-style="logos">
.s-logos {
  padding-block: clamp(40px, 1.6rem + 3vw, 72px);
}

.s-logos__inner {
  display: grid;
  gap: 24px;
  justify-items: center;
  text-align: center;
}

.s-logos__title {
  color: var(--muted);
  font-size: var(--t-small);
  font-weight: 600;
}

.s-logos__list {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 20px clamp(28px, 1rem + 3vw, 64px);
}

.s-logos__item {
  display: flex;
  align-items: center;
  min-height: 44px;
  color: var(--muted);
}

.s-logos__item img {
  height: 32px;
  width: auto;
}

.s-logos__placeholder {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-size: 1.125rem;
  font-weight: 800;
  letter-spacing: -0.02em;
}

.s-logos__placeholder svg {
  width: 24px;
  height: 24px;
}

.s-logos__note {
  color: var(--muted);
  font-size: var(--t-small);
}
</style>
<!-- section:{{id}} -->
<section id="{{id}}" class="s-logos section" aria-labelledby="{{id}}-titre" data-section="logos">
  <div class="wrap s-logos__inner">
    <p id="{{id}}-titre" class="s-logos__title">{{title}}</p>
    <ul class="s-logos__list" role="list">
      {{#logos}}<li class="s-logos__item">{{#src}}<img src="{{src}}" alt="{{name}}" width="{{width}}" height="{{height}}" loading="lazy">{{/src}}{{^src}}<span class="s-logos__placeholder">{{{mark}}}<span>{{name}}</span></span>{{/src}}</li>{{/logos}}
    </ul>
    {{#note}}<p class="s-logos__note">{{note}}</p>{{/note}}
  </div>
</section>
