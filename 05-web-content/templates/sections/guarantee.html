<style data-section-style="guarantee">
.s-guarantee__grid {
  display: grid;
  grid-template-columns: minmax(0, 0.75fr) minmax(0, 1.25fr);

  align-items: center;
  max-width: 1080px;
}

.s-guarantee__seal {
  justify-self: center;
  width: min(100%, 280px);
}

.s-guarantee__seal svg {
  width: 100%;
  height: auto;
  overflow: visible;
  transform: rotate(-8deg);
}

.s-guarantee__outer {
  fill: none;
  stroke: var(--line-strong);
  stroke-width: 1.5;
  stroke-dasharray: 3 5;
}

.s-guarantee__inner {
  fill: var(--surface);
  stroke: var(--hl);
  stroke-width: 2.5;
}

.s-guarantee__ring {
  fill: var(--ink);
  font-family: var(--font-mono);
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: 0.14em;
}

.s-guarantee__big {
  fill: var(--hl);
  font-family: var(--font-display);
  font-size: 92px;
  font-weight: 800;
  letter-spacing: -0.04em;
}

.s-guarantee__small {
  fill: var(--ink);
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 700;
}

.s-guarantee .section-head {
  margin-bottom: clamp(24px, 1rem + 1vw, 36px);
}

.s-guarantee__terms {
  border-top: 1px solid var(--line);
}

/* The term column holds a long word (« Remboursement ») without touching

.s-guarantee__row {
  display: grid;
  grid-template-columns: minmax(9.75rem, 0.22fr) minmax(0, 1fr);
  gap: 6px 28px;
  padding: 18px 0;
  border-bottom: 1px solid var(--line);
}

.s-guarantee__row dt {
  font-weight: 700;
  hyphens: auto;
  overflow-wrap: break-word;
}

.s-guarantee__row dd {
  color: var(--muted);

}
