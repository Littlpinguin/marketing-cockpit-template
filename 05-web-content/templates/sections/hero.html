<style data-section-style="hero">
.s-hero {
  padding-block: clamp(40px, 1.5rem + 5vw, 104px) clamp(64px, 2.5rem + 5vw, 120px);
}

.s-hero__grid {
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
  gap: clamp(48px, 2rem + 5vw, 112px);
  align-items: center;
}

.s-hero__title {
  font-size: var(--t-h1);
  line-height: 1.02;
  font-weight: 800;
  letter-spacing: -0.04em;
  text-wrap: balance;
}

.s-hero__lede {
  max-width: 30em;
  margin-top: clamp(20px, 1rem + 1vw, 28px);
  color: var(--muted);
}

.s-hero__actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 18px 28px;
  margin-top: clamp(28px, 1.4rem + 1.4vw, 40px);
}

.s-hero__deadline {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 2px 10px;
  color: var(--muted);
  font-size: var(--t-small);
  font-weight: 500;
  line-height: 1.4;
}

.s-hero__deadline::before {
  content: "";
  flex: none;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--brand-accent);
  box-shadow: 0 0 0 4px var(--tint-accent);
}

.s-hero__visual {
  position: relative;
  justify-self: end;
  width: 100%;
  max-width: 500px;
}

.s-hero__img {
  width: 100%;
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-lift);
}

.s-hero__doc .obj-sheet {
  padding: clamp(18px, 0.8rem + 1vw, 28px);
}

.s-hero__doc .obj-kpi {
  margin-top: 4px;
}

.s-hero__chip {
  bottom: -18px;
  left: 28px;
}

/* Rotating word: every word in the same grid cell, the widest sets the box. */
.s-hero__rot {
  display: inline-grid;
}

.s-hero__rot > span {
  grid-area: 1 / 1;
  opacity: 0;
  transform: translateY(0.25em);
  transition:
    opacity 0.5s var(--ease),
    transform 0.5s var(--ease);
}

.s-hero__rot > span.is-on {
  opacity: 1;
  transform: none;
}

@media (max-width: 1100px) {
  .s-hero__grid {
    grid-template-columns: minmax(0, 1fr);
  }

  .s-hero__visual {
    justify-self: start;
  }
}

</style>
<!-- section:{{id}} -->
<section id="{{id}}" class="s-hero section" aria-labelledby="{{id}}-titre" data-section="hero">
  <div class="wrap s-hero__grid">
    <div class="s-hero__text">
      <h1 id="{{id}}-titre" class="s-hero__title">{{{title}}}</h1>
      <p class="s-hero__lede lede">{{lede}}</p>
      <div class="s-hero__actions">
        <a class="btn btn--primary" href="{{cta_href}}" data-track="cta_click" data-cta-position="hero"{{#primary}} data-cta="primaire"{{/primary}}>{{cta_label}}<svg class="btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></a>
        {{#deadline}}<p class="s-hero__deadline"><span{{#countdown}} data-offer-countdown data-many="{{many}}" data-one="{{one}}" data-zero="{{zero}}"{{/countdown}}>{{deadline}}</span>{{#detail}}<span aria-hidden="true">·</span><span>{{detail}}</span>{{/detail}}</p>{{/deadline}}
      </div>
    </div>
    <div class="s-hero__visual" data-reveal="right">
      {{#image}}<img class="s-hero__img" src="{{src}}" alt="{{alt}}" width="{{width}}" height="{{height}}" fetchpriority="high">{{/image}}{{^image}}{{{object}}}{{/image}}
    </div>
  </div>
</section>
<!-- /section:{{id}} -->
<script data-section-script="hero">
(function () {
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('.s-hero [data-rotate]').forEach(function (el) {
    var words = el.getAttribute('data-rotate').split('|').map(function (w) { return w.trim(); }).filter(Boolean);
    if (words.length < 2) return;
    var stable = (el.textContent || '').trim() || words[0];
    el.textContent = '';
    var sr = document.createElement('span');
    sr.className = 'sr-only';
    sr.textContent = stable;
    var box = document.createElement('span');
    box.className = 's-hero__rot';
    box.setAttribute('aria-hidden', 'true');
    words.forEach(function (w, i) {
      var s = document.createElement('span');
      s.textContent = w;
      if (i === 0) s.className = 'is-on';
      box.appendChild(s);
    });
    el.appendChild(sr);
    el.appendChild(box);
    if (reduce) return;
    // Three rounds at most, and only while the hero is on screen.
    var i = 0, steps = 0, max = words.length * 3, onScreen = true;
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (entries) { onScreen = entries[0].isIntersecting; }).observe(el);
    }
    var timer = window.setInterval(function () {
      if (!onScreen) return;
      box.children[i].className = '';
      i = (i + 1) % words.length;
      box.children[i].className = 'is-on';
      if (++steps >= max) window.clearInterval(timer);
    }, 2600);
  });
})();
</script>
