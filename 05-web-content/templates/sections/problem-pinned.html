<style data-section-style="problem-pinned">
.s-problem__grid {
  display: grid;
  grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.05fr);
  gap: clamp(40px, 1rem + 5vw, 104px);
  align-items: start;
}

.s-problem__head {
  margin-bottom: clamp(24px, 1rem + 1.5vw, 40px);
}

.s-problem__visuals {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}

.s-problem__obj {
  width: 100%;
  max-width: 400px;
}

.s-problem__list {
  border-top: 1px solid var(--line);
}

.s-problem__item {
  position: relative;
  display: grid;
  grid-template-columns: 52px minmax(0, 1fr);
  gap: 0 16px;
  padding: clamp(18px, 0.8rem + 0.8vw, 26px) 0;
  border-bottom: 1px solid var(--line);
}

.s-problem__item::before {
  content: "";
  position: absolute;
  top: -1px;
  left: 0;
  width: 0;
  height: 2px;
  background: var(--gradient);
  transition: width 0.6s var(--ease);
}

.s-problem__num {
  padding-top: 0.3em;
  color: var(--hl);
  font-family: var(--font-mono);
  font-size: var(--t-small);
  font-weight: 600;
}

.s-problem__title {
  font-size: var(--t-h3);
  line-height: var(--lh-snug);
  font-weight: 700;
  letter-spacing: -0.015em;
  transition: color 0.4s var(--ease);
}

.s-problem__body {
  display: grid;
  grid-template-rows: 1fr;
  transition:
    grid-template-rows 0.5s var(--ease),
    opacity 0.4s var(--ease);
}

.s-problem__body > p {
  min-height: 0;
  overflow: hidden;
  padding-top: 10px;
  color: var(--muted);
  text-wrap: pretty;
}

@media (max-width: 1100px) {
  .s-problem__grid {
    grid-template-columns: minmax(0, 1fr);
  }

  .s-problem__visuals {
    display: none;
  }
}

/* Pinned (large screen, motion allowed): the stage holds while the
   constats pass, 55 vh each. Keep in sync with scroll.js (.sc-pin). */
.sc-pin .s-problem {
  padding-block: 0;
}

.sc-pin .s-problem__track {
  height: calc(100vh + var(--steps, 4) * 55vh);
}

.sc-pin .s-problem__stage {
  position: sticky;
  top: var(--topbar-h);
  display: flex;
  align-items: center;
  height: calc(100vh - var(--topbar-h));
}

.sc-pin .s-problem__stage > .wrap {
  width: var(--wrap);
}

.sc-pin .s-problem__visuals {
  grid-template-columns: minmax(0, 1fr);
}

.sc-pin .s-problem__visual {
  grid-area: 1 / 1;
  opacity: 0;
  transform: translateY(18px);
  transition:
    opacity 0.5s var(--ease),
    transform 0.5s var(--ease);
}

.sc-pin .s-problem__visual[data-active] {
  opacity: 1;
  transform: none;
}

.sc-pin .s-problem__item:not([data-active]) .s-problem__body {
  grid-template-rows: 0fr;
  opacity: 0;
}

.sc-pin .s-problem__item:not([data-active]) .s-problem__title {
  color: var(--muted);
}

.sc-pin .s-problem__item[data-active]::before {
  width: 100%;
}
</style>
<!-- section:{{id}} -->
<section id="{{id}}" class="s-problem section" aria-labelledby="{{id}}-titre" data-section="problem-pinned">
  <div class="s-problem__track" data-scroll-track>
    <div class="s-problem__stage">
      <div class="wrap s-problem__grid">
        <div class="s-problem__aside">
          <div class="section-head s-problem__head">
            <h2 id="{{id}}-titre" class="section-title">{{{title}}}</h2>
            <p class="section-intro">{{intro}}</p>
          </div>
          <div class="s-problem__visuals" aria-hidden="true" data-qa-decor>
            {{#items}}<div class="s-problem__visual" data-step-visual>{{{visual}}}</div>{{/items}}
          </div>
        </div>
        <ol class="s-problem__list" role="list">
          {{#items}}<li class="s-problem__item" data-step-item>
            <span class="s-problem__num" aria-hidden="true">0{{@index}}</span>
            <div>
              <h3 class="s-problem__title">{{title}}</h3>
              <div class="s-problem__body"><p>{{text}}</p></div>
            </div>
          </li>{{/items}}
        </ol>
      </div>
    </div>
  </div>
</section>
<!-- /section:{{id}} -->
