<style data-section-style="benefits">
.s-benefits__grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: clamp(16px, 0.6rem + 1.4vw, 28px);
}

.s-benefits__item {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 4px 20px;
  align-content: start;
  padding: clamp(22px, 1rem + 1.2vw, 34px);
}

.s-benefits__icon {
  grid-row: span 3;
  display: grid;
  place-items: center;
  width: 52px;
  height: 52px;
  border-radius: 14px;
  background: var(--tint);
  color: var(--hl);
}

.s-benefits__icon svg {
  width: 26px;
  height: 26px;
}

.s-benefits__title {
  font-size: var(--t-h3);
  line-height: var(--lh-snug);
  font-weight: 800;
  letter-spacing: -0.015em;
}

.s-benefits__text {
  margin-top: 6px;
  color: var(--muted);
  text-wrap: pretty;
}

.s-benefits__proof {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px dashed var(--line-strong);
  font-size: var(--t-small);
  font-weight: 600;
}

@media (max-width: 900px) {
  .s-benefits__grid {
    grid-template-columns: minmax(0, 1fr);
  }
}

@media (max-width: 640px) {
  .s-benefits__item {
    grid-template-columns: minmax(0, 1fr);
  }

  .s-benefits__icon {
    grid-row: auto;
    margin-bottom: 12px;
  }
}
</style>
<!-- section:{{id}} -->
<section id="{{id}}" class="s-benefits section" aria-labelledby="{{id}}-titre" data-section="benefits">
  <div class="wrap">
    <div class="section-head">
      <h2 id="{{id}}-titre" class="section-title">{{{title}}}</h2>
      {{#intro}}<p class="section-intro">{{intro}}</p>{{/intro}}
    </div>
    <ul class="s-benefits__grid" role="list" data-reveal-group>
      {{#items}}<li class="s-benefits__item card" data-reveal>
        <span class="s-benefits__icon" aria-hidden="true">{{{icon}}}</span>
        <h3 class="s-benefits__title">{{title}}</h3>
        <p class="s-benefits__text">{{text}}</p>
        {{#proof}}<p class="s-benefits__proof">{{proof}}</p>{{/proof}}
      </li>{{/items}}
    </ul>
  </div>
</section>
<!-- /section:{{id}} -->
