<style data-section-style="program">
.s-program__grid {
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
  gap: clamp(40px, 1rem + 5vw, 104px);
  align-items: start;
}

.s-program__list {
  position: relative;
}

.s-program__list::before,
.s-program__list::after {
  content: "";
  position: absolute;
  top: 30px;
  bottom: 30px;
  left: 7px;
  width: 2px;
  border-radius: 2px;
}

.s-program__list::before {
  background: var(--line);
}

.s-program__list::after {
  background: var(--gradient-v);
  transform-origin: 50% 0;
  transform: scaleY(var(--rail, 1));
}

.s-program__item {
  position: relative;
  display: grid;
  grid-template-columns: 16px minmax(0, 1fr) auto;
  gap: 4px 24px;
  padding: 20px 0;
  border-bottom: 1px solid var(--line);
}

.s-program__item:last-child {
  border-bottom: 0;
}

.s-program__dot {
  position: relative;
  z-index: 1;
  grid-row: span 2;
  width: 16px;
  height: 16px;
  margin-top: 6px;
  border: 2px solid var(--line-strong);
  border-radius: 50%;
  background: var(--paper);
  transition:
    background-color 0.4s var(--ease),
    border-color 0.4s var(--ease);
}

.s-program__item[data-reached="true"] .s-program__dot {
  border-color: var(--brand-primary);
  background: var(--brand-primary);
}

.s-program__when {
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: var(--t-label);
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.s-program__title {
  font-size: var(--t-h3);
  line-height: var(--lh-snug);
  font-weight: 800;
  letter-spacing: -0.015em;
}

.s-program__duration {
  grid-column: 3;
  grid-row: 1 / span 2;
  align-self: center;
  padding: 4px 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius-badge);
  color: var(--muted);
  font-size: var(--t-small);
  font-weight: 600;
  white-space: nowrap;
}

.s-program__text {
  grid-column: 2 / span 2;
  color: var(--muted);
  text-wrap: pretty;
}

.s-program__specimen {
  position: sticky;
  top: calc(var(--topbar-h) + 32px);
}

.s-program__figure {
  display: grid;
  gap: 16px;
  padding: clamp(20px, 1rem + 1vw, 32px);
  border-radius: var(--radius-card);
  background: var(--surface-2);
}

.s-program__figure .obj {
  transform: rotate(-1.5deg);
}

.s-program__figure figcaption {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 12px;
  color: var(--muted);
}

@media (max-width: 1100px) {
  .s-program__grid {
    grid-template-columns: minmax(0, 1fr);
  }

  .s-program__specimen {
    position: static;
    max-width: 560px;
  }
}

@media (max-width: 640px) {
  .s-program__item {
    grid-template-columns: 16px minmax(0, 1fr);
  }

  .s-program__duration {
    grid-column: 2;
    grid-row: auto;
    justify-self: start;
    margin-top: 8px;
  }

  .s-program__text {
    grid-column: 2;
  }
}
/* Narrative gauge (optional field gauge of each module; the .gauge
   component lives in base.css). With motion on a large screen, a track as
   tall as the list, in the left margin, holds one label centred in the
   viewport: the label of the last module reached by the reading line
   (data-reached, written by scroll.js on the rail), matched by rank
   without a script (twelve modules at most). Elsewhere: each module shows
   its own label before its date. */
.s-program__run {
  position: relative;
}

.s-program__track {
  display: none;
}

.sc-pin .s-program__item .gauge--step {
  display: none;
}

@media (min-width: 1101px) {
  .sc-pin .s-program__track {
    display: block;
    position: absolute;
    top: 0;
    right: calc(100% + 20px);
    bottom: 0;
    pointer-events: none;
  }

  .sc-pin .s-program__gauge {
    display: block;
    position: sticky;
    top: 50vh;
    transform: translateY(-50%) rotate(180deg);
  }
}

.s-program__run:not(:has([data-reached="true"])) .s-program__gauge .gauge__label:first-child,
.s-program__run:has(.s-program__item:last-child[data-reached="true"]) .s-program__gauge .gauge__label:last-child,
.s-program__run:has(.s-program__item:nth-child(1)[data-reached="true"] + :not([data-reached="true"])) .s-program__gauge .gauge__label:nth-child(1),
.s-program__run:has(.s-program__item:nth-child(2)[data-reached="true"] + :not([data-reached="true"])) .s-program__gauge .gauge__label:nth-child(2),
.s-program__run:has(.s-program__item:nth-child(3)[data-reached="true"] + :not([data-reached="true"])) .s-program__gauge .gauge__label:nth-child(3),
.s-program__run:has(.s-program__item:nth-child(4)[data-reached="true"] + :not([data-reached="true"])) .s-program__gauge .gauge__label:nth-child(4),
.s-program__run:has(.s-program__item:nth-child(5)[data-reached="true"] + :not([data-reached="true"])) .s-program__gauge .gauge__label:nth-child(5),
.s-program__run:has(.s-program__item:nth-child(6)[data-reached="true"] + :not([data-reached="true"])) .s-program__gauge .gauge__label:nth-child(6),
.s-program__run:has(.s-program__item:nth-child(7)[data-reached="true"] + :not([data-reached="true"])) .s-program__gauge .gauge__label:nth-child(7),
.s-program__run:has(.s-program__item:nth-child(8)[data-reached="true"] + :not([data-reached="true"])) .s-program__gauge .gauge__label:nth-child(8),
.s-program__run:has(.s-program__item:nth-child(9)[data-reached="true"] + :not([data-reached="true"])) .s-program__gauge .gauge__label:nth-child(9),
.s-program__run:has(.s-program__item:nth-child(10)[data-reached="true"] + :not([data-reached="true"])) .s-program__gauge .gauge__label:nth-child(10),
.s-program__run:has(.s-program__item:nth-child(11)[data-reached="true"] + :not([data-reached="true"])) .s-program__gauge .gauge__label:nth-child(11),
.s-program__run:has(.s-program__item:nth-child(12)[data-reached="true"] + :not([data-reached="true"])) .s-program__gauge .gauge__label:nth-child(12) {
  display: inline;
}
</style>
<!-- section:{{id}} -->
<section id="{{id}}" class="s-program section" aria-labelledby="{{id}}-titre" data-section="program">
  <div class="wrap s-program__grid">
    <div>
      <div class="section-head">
        <h2 id="{{id}}-titre" class="section-title">{{{title}}}</h2>
        <p class="section-intro">{{intro}}</p>
      </div>
      <div class="s-program__run">
        <ol class="s-program__list" role="list" data-rail>
          {{#modules}}<li class="s-program__item" data-milestone>
            <span class="s-program__dot" aria-hidden="true"></span>
            <p class="s-program__when">{{#gauge}}<span class="gauge gauge--step" aria-hidden="true" data-qa-decor>{{{gauge}}}</span>{{/gauge}}{{when}}</p>
            <h3 class="s-program__title">{{title}}</h3>
            <p class="s-program__duration">{{duration}}</p>
            <p class="s-program__text">{{text}}</p>
          </li>{{/modules}}
        </ol>
        {{#modules}}{{#@last}}{{#gauge}}<div class="s-program__track" aria-hidden="true" data-qa-decor><p class="gauge gauge--live s-program__gauge">{{#modules}}<span class="gauge__label">{{{gauge}}}</span>{{/modules}}</p></div>{{/gauge}}{{/@last}}{{/modules}}
      </div>
    </div>
    <figure class="s-program__specimen">
      <div class="s-program__figure">
        <div aria-hidden="true" data-qa-decor>{{{specimen}}}</div>
        <figcaption><span class="badge">{{specimen_badge}}</span><span>{{specimen_caption}}</span></figcaption>
      </div>
    </figure>
  </div>
</section>
<!-- /section:{{id}} -->
