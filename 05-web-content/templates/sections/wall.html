<style data-section-style="wall">
.s-wall__layout {
  display: grid;
  grid-template-columns: minmax(0, 0.72fr) minmax(0, 1.28fr);
  gap: clamp(32px, 1rem + 4vw, 88px);
}

/* No summary and no pull quote: the wall takes the whole width. */
.s-wall__layout:not(:has(.s-wall__aside > *)) {
  grid-template-columns: minmax(0, 1fr);
}

.s-wall__layout:not(:has(.s-wall__aside > *)) .s-wall__aside {
  display: none;
}

.s-wall__layout:not(:has(.s-wall__aside > *)) .s-wall__list {
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 20rem), 1fr));
}

.s-wall__aside {
  display: grid;
  align-content: start;
  align-self: start;
  gap: clamp(28px, 1rem + 1.6vw, 44px);
}

/* The left column stays on screen while the wall scrolls, on screens tall
   enough to hold it whole (no pinning: it costs nothing to the page budget). */
@media (min-width: 1101px) and (min-height: 760px) {
  .s-wall__aside {
    position: sticky;
    top: calc(var(--topbar-h) + 40px);
  }
}

.s-wall__summary {
  display: grid;
  gap: 6px;
  padding-top: 20px;
  border-top: 1px solid var(--line-strong);
}

.s-wall__score {
  font-size: clamp(2.25rem, 1.6rem + 2vw, 3.25rem);
  line-height: 1;
  font-weight: 800;
  letter-spacing: -0.035em;
  font-variant-numeric: tabular-nums;
}

.s-wall__source {
  color: var(--muted);
  font-size: var(--t-small);
  line-height: 1.45;
}

.s-wall__pull {
  position: relative;
  display: grid;
  gap: 18px;
  padding-left: 24px;
}

.s-wall__pull::before {
  content: "";
  position: absolute;
  top: 4px;
  bottom: 4px;
  left: 0;
  width: 3px;
  border-radius: 3px;
  background: var(--gradient-v);
}

.s-wall__pull blockquote p {
  font-size: clamp(1.375rem, 1.1rem + 0.9vw, 1.75rem);
  line-height: 1.3;
  font-weight: 700;
  letter-spacing: -0.015em;
  text-wrap: pretty;
}

/* Cards keep their own height (align-items: start): a long review or a
   video never leaves a hollow card next to it. */
.s-wall__list {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  align-items: start;
  gap: clamp(14px, 0.5rem + 1vw, 24px);
}

/* Masonry only where the browser lays it out natively: reading and tab
   order stay the DOM order (never CSS columns, never a script that moves
   cards between columns). */
@supports (grid-template-rows: masonry) {
  .s-wall__list {
    grid-template-rows: masonry;
  }
}

.s-wall__item {
  min-width: 0;
  border-radius: var(--radius-card);
}

.s-wall__card {
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding: clamp(20px, 0.9rem + 0.9vw, 28px);
}

.s-wall__result {
  color: var(--hl);
  font-size: 1.125rem;
  line-height: 1.3;
  font-weight: 800;
  letter-spacing: -0.01em;
  text-wrap: balance;
}

.s-wall__quote p {
  text-wrap: pretty;
}

.s-wall__quote p::before {
  content: "«\00a0";
}

.s-wall__quote p::after {
  content: "\00a0»";
}

.s-wall__who {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: auto;
  padding-top: 16px;
  border-top: 1px solid var(--line);
}

.s-wall__pull .s-wall__who {
  margin-top: 0;
  padding-top: 0;
  border-top: 0;
}

.s-wall__avatar {
  display: grid;
  flex: none;
  place-items: center;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--tint);
  color: var(--hl);
  font-size: var(--t-small);
  font-weight: 800;
}

.s-wall__name {
  display: block;
  font-weight: 700;
  line-height: 1.3;
}

.s-wall__role {
  display: block;
  color: var(--muted);
  font-size: var(--t-small);
  line-height: 1.4;
}

/* Video: a compact row (thumbnail, label, duration) under the quote, opened
   by the viewer engine; a plain link to the file without JavaScript. Without
   a poster, a composition in the brand colours: initials and a play disc. */
.s-wall__video {
  display: flex;
  align-items: center;
  gap: 16px;
  margin: 0 -8px;
  padding: 8px;
  border-radius: calc(var(--radius-card) - 4px);
  color: var(--ink);
  text-decoration: none;
  transition: background-color var(--dur-fast) var(--ease);
}

.s-wall__video:hover {
  background: var(--surface-2);
}

.s-wall__thumb {
  position: relative;
  display: grid;
  flex: none;
  place-items: center end;
  padding-right: 14px;
  width: clamp(112px, 34%, 148px);
  aspect-ratio: 16 / 9;
  overflow: hidden;
  border-radius: 10px;
  background: var(--tint);
}

.s-wall__thumb img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.s-wall__mark {
  color: var(--hl);
  font-size: 1.75rem;
  font-weight: 800;
  letter-spacing: -0.04em;
  line-height: 1;
}

.s-wall__play {
  position: absolute;
  top: calc(50% - 16px);
  left: 10px;
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--ink);
  color: var(--paper);
  transition: transform var(--dur-fast) var(--ease);
}

.s-wall__play svg {
  width: 14px;
  height: 14px;
  margin-left: 2px;
}

.s-wall__video:hover .s-wall__play {
  transform: scale(1.1);
}

.s-wall__video-label {
  display: grid;
  gap: 2px;
  min-width: 0;
}

.s-wall__video-text {
  font-weight: 700;
  line-height: 1.3;
  text-decoration: underline;
  text-decoration-color: var(--line-strong);
  text-underline-offset: 0.3em;
}

.s-wall__video:hover .s-wall__video-text {
  text-decoration-color: currentColor;
}

.s-wall__duration {
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: var(--t-label);
  font-weight: 500;
  letter-spacing: 0.04em;
}

.s-wall__transcript summary {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 44px;
  font-weight: 600;
  cursor: pointer;
  list-style: none;
}

.s-wall__transcript summary::-webkit-details-marker {
  display: none;
}

.s-wall__transcript summary::before {
  content: "";
  flex: none;
  width: 8px;
  height: 8px;
  margin-left: 2px;
  border-right: 2px solid currentColor;
  border-bottom: 2px solid currentColor;
  transform: rotate(-45deg);
  transition: transform var(--dur-fast) var(--ease);
}

.s-wall__transcript[open] summary::before {
  transform: rotate(45deg);
}

.s-wall__transcript p {
  padding-bottom: 6px;
  color: var(--muted);
  text-wrap: pretty;
}

/* The fold: a rule across the column, the button in its middle. */
.s-wall__fold {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-top: clamp(24px, 1rem + 1vw, 36px);
}

.s-wall__fold::before,
.s-wall__fold::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--line-strong);
}

.s-wall__more {
  display: inline-flex;
  flex: none;
  align-items: center;
  gap: 10px;
  min-height: 48px;
  padding: 10px 24px;
  border: 1.5px solid var(--line-strong);
  border-radius: var(--radius-cta);
  background: var(--surface);
  color: var(--ink);
  font-size: 1rem;
  font-weight: 600;
  line-height: 1.2;
  cursor: pointer;
  transition: border-color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
}

.s-wall__more:hover {
  border-color: var(--ink);
  transform: translateY(-2px);
}

.s-wall__more svg {
  flex: none;
  width: 18px;
  height: 18px;
  transition: transform var(--dur-fast) var(--ease);
}

.s-wall__more[aria-expanded="true"] svg {
  transform: rotate(180deg);
}

@media (prefers-reduced-motion: no-preference) {
  .s-wall__item.is-new {
    animation: s-wall-in 0.5s var(--ease) both;
    animation-delay: calc(var(--k, 0) * 60ms);
  }
}

@keyframes s-wall-in {
  from {
    opacity: 0;
    transform: translate3d(0, 18px, 0);
  }
}

@media (max-width: 1100px) {
  .s-wall__layout {
    grid-template-columns: minmax(0, 1fr);
  }

  .s-wall__aside {
    max-width: 40rem;
  }
}

@media (max-width: 640px) {
  .s-wall__list {
    grid-template-columns: minmax(0, 1fr);
  }

  .s-wall__fold {
    gap: 12px;
  }
}
</style>
<!-- section:{{id}} -->
<section id="{{id}}" class="s-wall section" aria-labelledby="{{id}}-titre" data-section="wall">
  <div class="wrap">
    <div class="section-head">
      <h2 id="{{id}}-titre" class="section-title">{{{title}}}</h2>
      {{#intro}}<p class="section-intro">{{intro}}</p>{{/intro}}
    </div>
    <div class="s-wall__layout">
      <div class="s-wall__aside">
        {{#summary}}<p class="s-wall__summary"><span class="s-wall__score">{{value}}</span><span class="s-wall__detail">{{detail}}</span>{{#source}}<span class="s-wall__source">{{source}}</span>{{/source}}</p>{{/summary}}
        {{#pull}}<figure class="s-wall__pull">
          <blockquote><p>{{quote}}</p></blockquote>
          <figcaption class="s-wall__who"><span class="s-wall__avatar" aria-hidden="true">{{initials}}</span><span><span class="s-wall__name">{{name}}</span><span class="s-wall__role">{{role}}</span></span></figcaption>
        </figure>{{/pull}}
      </div>
      <div class="s-wall__main">
        <ul class="s-wall__list" id="{{id}}-avis" role="list" data-wall-fold="{{fold_after}}" data-reveal-group>
          {{#quotes}}<li class="s-wall__item" data-reveal>
            <figure class="s-wall__card card">
              {{#result}}<p class="s-wall__result">{{result}}</p>{{/result}}
              <blockquote class="s-wall__quote"><p>{{quote}}</p></blockquote>
              {{#video}}<a class="s-wall__video" href="{{src}}" data-viewer="video" data-viewer-group="{{id}}-videos" data-viewer-title="{{name}}" data-viewer-caption="{{role}}"{{#poster}} data-viewer-poster="{{poster}}"{{/poster}}{{#captions}} data-viewer-captions="{{captions}}"{{/captions}}>
                <span class="s-wall__thumb" aria-hidden="true" data-qa-decor>{{#poster}}<img src="{{poster}}" alt="" loading="lazy">{{/poster}}{{^poster}}<span class="s-wall__mark">{{initials}}</span>{{/poster}}<span class="s-wall__play"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M7 4.5v15l12.5-7.5z"/></svg></span></span>
                <span class="s-wall__video-label"><span class="s-wall__video-text">{{video_label}}<span class="sr-only"> : {{name}}</span></span>{{#duration}}<span class="s-wall__duration">{{duration}}</span>{{/duration}}</span>
              </a>{{/video}}
              {{#video.transcript}}<details class="s-wall__transcript"><summary>{{transcript_label}}</summary><p>{{.}}</p></details>{{/video.transcript}}
              <figcaption class="s-wall__who"><span class="s-wall__avatar" aria-hidden="true">{{initials}}</span><span><span class="s-wall__name">{{name}}</span><span class="s-wall__role">{{role}}</span></span></figcaption>
            </figure>
          </li>{{/quotes}}
        </ul>
        <div class="s-wall__fold" hidden>
          <button type="button" class="s-wall__more" aria-expanded="false" aria-controls="{{id}}-avis" data-more="{{more_label}}" data-less="{{less_label}}"><span data-wall-label>{{more_label}}</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m6 9 6 6 6-6"/></svg></button>
        </div>
      </div>
    </div>
  </div>
</section>

<script data-section-script="wall">
(function () {
  // Fold: without JavaScript every review is visible. The script hides the
  // ones after fold_after (real `hidden`, out of the keyboard and the
  // accessibility tree), shows the button that says how many remain, and
  // moves the focus to the first review it reveals.
  document.querySelectorAll('.s-wall').forEach(function (wall) {
    var list = wall.querySelector('.s-wall__list');
    var fold = wall.querySelector('.s-wall__fold');
    var button = fold && fold.querySelector('.s-wall__more');
    var text = button && button.querySelector('[data-wall-label]');
    if (!list || !button || !text) return;
    var items = Array.prototype.slice.call(list.children);
    var keep = parseInt(list.getAttribute('data-wall-fold'), 10);
    if (!(keep > 0) || items.length - keep < 2) return;
    var extra = items.slice(keep);
    var more = (button.getAttribute('data-more') || '')
      .split('{n}').join(String(extra.length))
      .split('{total}').join(String(items.length));
    var less = button.getAttribute('data-less') || '';

    function set(open, byHand) {
      extra.forEach(function (li, k) {
        li.hidden = !open;
        li.classList.toggle('is-new', open && byHand);
        li.style.setProperty('--k', String(Math.min(k, 8)));
      });
      button.setAttribute('aria-expanded', open ? 'true' : 'false');
      text.textContent = open ? less : more;

      fold.hidden = open && !less;
      if (!open && byHand) button.focus();
    }

    set(false, false);
    fold.hidden = false;
    button.addEventListener('click', function () {
      set(button.getAttribute('aria-expanded') !== 'true', true);
    });
  });
})();
