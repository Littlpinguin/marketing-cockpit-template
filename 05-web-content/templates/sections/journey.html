<style data-section-style="journey">
.s-journey__grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: clamp(40px, 1rem + 5vw, 104px);
  align-items: center;
}

.s-journey__counter {
  display: none;
  margin-bottom: 20px;
}

.s-journey__list {
  position: relative;
  display: grid;
  gap: 4px;
}

/* The rail: a hairline behind the dots, filled by --rail (list) or --p (pinned). */
.s-journey__list::before,
.s-journey__list::after {
  content: "";
  position: absolute;
  top: 20px;
  bottom: 20px;
  left: 11px;
  width: 2px;
  border-radius: 2px;
}

.s-journey__list::before {
  background: var(--line);
}

.s-journey__list::after {
  background: var(--gradient-v);
  transform-origin: 50% 0;
  transform: scaleY(var(--rail, 1));
}

.s-journey__step {
  position: relative;
  display: grid;
  grid-template-columns: 24px minmax(0, 1fr);
  gap: 0 24px;
  padding: 14px 0;
}

.s-journey__dot {
  position: relative;
  z-index: 1;
  width: 24px;
  height: 24px;
  margin-top: 2px;
  border: 2px solid var(--line-strong);
  border-radius: 50%;
  background: var(--paper);
  transition:
    background-color 0.4s var(--ease),
    border-color 0.4s var(--ease);
}

.s-journey__when {
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: var(--t-label);
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.s-journey__title {
  margin-top: 4px;
  font-size: var(--t-h3);
  line-height: var(--lh-snug);
  font-weight: 800;
  letter-spacing: -0.015em;
  transition: color 0.4s var(--ease);
}

.s-journey__body {
  display: grid;
  grid-template-rows: 1fr;
  transition:
    grid-template-rows 0.5s var(--ease),
    opacity 0.4s var(--ease);
}

.s-journey__body > div {
  min-height: 0;
  overflow: hidden;
}

.s-journey__text {
  padding-top: 8px;
  color: var(--muted);
  text-wrap: pretty;
}

.s-journey__outcome {
  margin-top: 12px;
  padding: 10px 14px;
  border-radius: var(--radius-input);
  background: var(--tint);
  font-weight: 600;
}

.s-journey__outcome strong {
  color: var(--hl);
}

.s-journey__scenes {
  display: none;
}

.s-journey__scene .obj {
  width: 100%;
  max-width: 460px;
  margin-inline: auto;
}

/* Not pinned: every step open, dots fill as the reading line passes them. */
:root:not(.sc-pin) .s-journey__step[data-reached="true"] .s-journey__dot {
  border-color: var(--brand-primary);
  background: var(--brand-primary);
  box-shadow: inset 0 0 0 4px var(--paper);
}

@media (max-width: 1100px) {
  .s-journey__grid {
    grid-template-columns: minmax(0, 1fr);
  }
}

/* Pinned: the block holds one screen, 60 vh per step. Keep in sync with scroll.js. */
.sc-pin .s-journey__track {
  height: calc(100vh + var(--steps, 4) * 60vh);
}

.sc-pin .s-journey__stage {
  position: sticky;
  top: var(--topbar-h);
  display: flex;
  align-items: center;
  height: calc(100vh - var(--topbar-h));
}

.sc-pin .s-journey__stage > .wrap {
  width: var(--wrap);
}

.sc-pin .s-journey__counter {
  display: block;
}

.sc-pin .s-journey__list::after {
  transform: scaleY(var(--p, 0));
}

.sc-pin .s-journey__step:not([data-active]) .s-journey__body {
  grid-template-rows: 0fr;
  opacity: 0;
}

.sc-pin .s-journey__step:not([data-active]) .s-journey__title {
  color: var(--muted);
}

.sc-pin .s-journey__step[data-active] .s-journey__dot,
.sc-pin .s-journey__step:has(~ .s-journey__step[data-active]) .s-journey__dot {
  border-color: var(--brand-primary);
  background: var(--brand-primary);
  box-shadow: inset 0 0 0 4px var(--paper);
}

.sc-pin .s-journey__scenes {
  display: grid;
}

.sc-pin .s-journey__scene {
  grid-area: 1 / 1;
  align-self: center;
  opacity: 0;
  transform: translateY(24px) scale(0.98);
  transition:
    opacity 0.55s var(--ease),
    transform 0.55s var(--ease);
}

.sc-pin .s-journey__scene[data-active] {
  opacity: 1;
  transform: none;
}
</style>
<!-- section:{{id}} -->
<section id="{{id}}" class="s-journey section" aria-labelledby="{{id}}-titre" data-section="journey">
  <div class="wrap">
    <div class="section-head">
      <h2 id="{{id}}-titre" class="section-title">{{{title}}}</h2>
      <p class="section-intro">{{intro}}</p>
    </div>
  </div>
  <div class="s-journey__track" data-scroll-track>
    <div class="s-journey__stage">
      <div class="wrap s-journey__grid">
        <div>
          <p class="s-journey__counter label" aria-hidden="true">{{counter_label}} <span data-step-current>1</span> / {{steps.length}}</p>
          <ol class="s-journey__list" role="list" data-rail>
            {{#steps}}<li class="s-journey__step" data-step-item data-milestone>
              <span class="s-journey__dot" aria-hidden="true"></span>
              <div>
                <p class="s-journey__when">{{when}}</p>
                <h3 class="s-journey__title">{{title}}</h3>
                <div class="s-journey__body"><div>
                  <p class="s-journey__text">{{text}}</p>
                  {{#outcome}}<p class="s-journey__outcome"><strong>{{outcome_label}}</strong> {{outcome}}</p>{{/outcome}}
                </div></div>
              </div>
            </li>{{/steps}}
          </ol>
        </div>
        <div class="s-journey__scenes" aria-hidden="true" data-qa-decor>
          {{#steps}}<div class="s-journey__scene" data-step-visual>{{{scene}}}</div>{{/steps}}
        </div>
      </div>
    </div>
  </div>
</section>
<!-- /section:{{id}} -->
