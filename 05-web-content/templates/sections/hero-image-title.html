<style data-section-style="hero-image-title">
/* The title carries the image: a pill at the height of the capitals, set
   between two words, glued to the next one by a no-break space. The title
   spans the grid; the lede and the action follow underneath. */
.s-himg {
  padding-block: clamp(40px, 1.5rem + 5vw, 104px) clamp(64px, 2.5rem + 5vw, 120px);
}

.s-himg__title {
  max-width: 15em;
  font-size: clamp(2.75rem, 0.8rem + 6.4vw, 7rem);
  line-height: 1.02;
  font-weight: 800;
  letter-spacing: -0.04em;
  text-wrap: balance;
  overflow-wrap: break-word;
}

@supports (text-box: trim-both cap alphabetic) {
  .s-himg__title {
    text-box: trim-both cap alphabetic;
  }
}

/* The pill: its colours come from the tone, the scene inside is drawn in
   currentColor; .s-himg__ko takes the colour of the ground (a cut-out). */
/* The pill and the word after it never part (an atomic inline is a break
   opportunity of its own, the no-break space alone does not hold it). */
.s-himg__glue {
  white-space: nowrap;
}

.s-himg__pic {
  --pic-ground: var(--surface);
  position: relative;
  display: inline-block;
  height: 0.8em;
  aspect-ratio: 2.2 / 1;
  overflow: hidden;
  vertical-align: -0.02em;
  border-radius: var(--radius-cta);
  background: linear-gradient(var(--tint), var(--tint)), var(--pic-ground);
  color: var(--hl);
  box-shadow: inset 0 0 0 1px var(--line);
}

.s-himg__pic--gradient {
  --pic-ground: var(--brand-primary);
  background: var(--gradient);
  color: var(--brand-white);
  box-shadow: none;
}

.s-himg__pic--dark {
  --pic-ground: var(--brand-dark);
  background: var(--brand-dark);
  color: var(--brand-light);
  box-shadow: none;
}

.s-himg__pic > svg,
.s-himg__pic > img {
  display: block;
  width: 100%;
  height: 100%;
}

.s-himg__pic > img {
  object-fit: cover;
}

.s-himg__pic .s-himg__ko {
  stroke: var(--pic-ground);
}

/* Entrance: the pill opens from its centre, once, after the title is read. */
.rv-on .s-himg__pic[data-reveal] {
  opacity: 1;
  transform: none;
  clip-path: inset(0 50% round var(--radius-cta));
  transition: clip-path 0.9s var(--ease) 0.3s;
}

.rv-on .s-himg__pic[data-reveal].is-in {
  clip-path: inset(0 round var(--radius-cta));
}

.s-himg__body {
  display: grid;
  justify-items: start;
  gap: clamp(20px, 1rem + 0.8vw, 28px);
  max-width: 38rem;
  margin-top: clamp(28px, 1rem + 2.4vw, 56px);
}

.s-himg__lede {
  color: var(--muted);
}

.s-himg__buttons {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px 28px;
  margin-top: 4px;
}

/* Deadline line: a status dot, then the deadline and its detail. The
   separator sits in the gap before the detail, inside it: when the detail
   starts a line of its own, the separator is clipped with the edge, so it
   never ends or starts a line. A wrapped detail lines up with the deadline
   text, after the dot. */
.s-himg__deadline {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  align-items: start;
  column-gap: 10px;
  margin-top: -6px;
  color: var(--muted);
  font-size: var(--t-small);
  font-weight: 500;
  line-height: 1.4;
}

.s-himg__deadline::before {
  content: "";
  width: 8px;
  height: 8px;
  margin-top: calc(0.7em - 4px);
  border-radius: 50%;
  background: var(--brand-accent);
  box-shadow: 0 0 0 4px var(--tint-accent);
}

.s-himg__when {
  display: flex;
  flex-wrap: wrap;
  gap: 2px 24px;
  overflow: hidden;
}

.s-himg__detail {
  position: relative;
}

/* Centred in the 24 px gap (4 + 16 + 4), its box wholly outside the line
   once the detail starts it. */
.s-himg__sep {
  position: absolute;
  inset-inline-end: calc(100% + 4px);
  width: 16px;
  text-align: center;
}

.s-himg__proof {
  display: flex;
  align-items: baseline;
  gap: 8px;
  color: var(--muted);
  font-size: var(--t-small);
  line-height: 1.45;
}

.s-himg__proof svg {
  flex: none;
  width: 16px;
  height: 16px;
  color: var(--hl);
  transform: translateY(3px);
}

/* Wide screens: the lede and the action sit under the title, offset by two
   columns of the grid, so that the title keeps the left edge to itself. */
@media (min-width: 1101px) {
  .s-himg__body {
    margin-left: calc((100% + var(--gutter)) / 12 * 2);
  }
}
</style>
<!-- section:{{id}} -->
<section id="{{id}}" class="s-himg section" aria-labelledby="{{id}}-titre" data-section="hero-image-title">
  <div class="wrap">
    <h{{level}} id="{{id}}-titre" class="s-himg__title">{{{title_start}}} <span class="s-himg__glue"><span class="s-himg__pic s-himg__pic--{{tone}}"{{^image.alt}} aria-hidden="true" data-qa-decor{{/image.alt}} data-reveal>{{#image}}<img src="{{src}}" alt="{{alt}}" width="{{width}}" height="{{height}}" fetchpriority="high">{{/image}}{{^image}}{{{object}}}{{/image}}</span>&nbsp;</span>{{{title_end}}}</h{{level}}>
    <div class="s-himg__body">
      <p class="s-himg__lede lede">{{lede}}</p>
      <div class="s-himg__buttons">
        <a class="btn btn--primary" href="{{cta_href}}" data-track="cta_click" data-cta-position="hero"{{#primary}} data-cta="primaire"{{/primary}}>{{cta_label}}<svg class="btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></a>
        {{#secondary_label}}<a class="link-arrow" href="{{secondary_href}}" data-track="cta_click" data-cta-position="hero-lien">{{secondary_label}}</a>{{/secondary_label}}
      </div>
      {{#deadline}}<p class="s-himg__deadline"><span class="s-himg__when"><span{{#countdown}} data-offer-countdown data-many="{{many}}" data-one="{{one}}" data-zero="{{zero}}"{{/countdown}}>{{deadline}}</span>{{#detail}} <span class="s-himg__detail"><span class="s-himg__sep" aria-hidden="true">·</span>{{detail}}</span>{{/detail}}</span></p>{{/deadline}}
      {{#proof}}<p class="s-himg__proof"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>{{proof}}</span></p>{{/proof}}
    </div>
  </div>
</section>
<!-- /section:{{id}} -->
